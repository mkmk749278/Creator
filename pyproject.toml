[project]
name = "phone-consensus"
version = "0.0.1"
description = "Consensus phone review video pipeline"
requires-python = ">=3.11"
dependencies = [
  "anthropic==1.11.0",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[project.optional-dependencies]
collect = ["yt-dlp==2026.8.19"]
# audio mixing, contact sheets and fetch helpers used by scripts/ and projects/*/tools
media = ["numpy==2.5.3", "scipy==1.18.1", "soundfile==0.14.0", "requests==2.34.2", "pillow==12.3.0"]

[tool.setuptools.packages.find]
include = ["pipeline*"]
