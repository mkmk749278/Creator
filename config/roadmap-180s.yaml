# Be Practical with Kishore: 180-second engineering explainer roadmap (owner, 2026-10-20).
# Transcribed from the owner's PDF "Engineering the Three-Minute Epiphany", section 5. Rules: PLAYBOOK §4a-9.
# Publish in this order: each film's last 15 s bridges to `next`, and its end screen links to that film.
# `list_no` is the topic's number in the owner's original 50-topic list. `existing` points at an earlier long film on
# the same subject: read it first and keep its numbers and advice (series continuity, PLAYBOOK §4a-4).
# The mechanism, visual and bridge notes are planning notes, not facts: every number in them (frequencies, pressures,
# percentages, dot counts) goes through /fact-check before it is spoken or shown. Fix the bridge line if a fact changes.

sprints:
  - id: 1
    name: Digital Money & Everyday Telecom Loop
    focus: Capturing high-intent daily friction points, demystifying the India Stack, and establishing baseline retention.
  - id: 2
    name: Indian Railways & Heavy Infrastructure Loop
    focus: High-volume curiosity regarding rail physics; establishes dark-mode mechanical cross-section supremacy.
  - id: 3
    name: Wireless Networks, Signals & Internet Architecture
    focus: Resolving network latency and invisible protocol bottlenecks for tech workers and digital natives.
  - id: 4
    name: Smartphone Hardware & Sensory Physics
    focus: Deconstructing the micro-sensors and electromechanical systems running inside everyday devices.
  - id: 5
    name: Home Appliances, Power & Grid Dynamics
    focus: Resolving everyday household electrical questions and scaling up to national grid physics.
  - id: 6
    name: Automotive Dynamics & Heavy Machinery
    focus: Deepening engagement with two-wheeler mechanics, automotive dynamics, and industrial scales.
  - id: 7
    name: Deep Tech, Defense & Frontier Physics
    focus: Channel flagship topics; advanced explainers delivering unmatched visual production value.

