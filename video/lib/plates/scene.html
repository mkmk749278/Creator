      @font-face { font-family: "Bricolage"; font-weight: 800; src: url("vendor/fonts/bricolage-grotesque-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+20B9, U+2212, U+0100-024F; }

      html, body { margin: 0; background: #0a0705; }
      #root { position: relative; overflow: hidden; width: 1920px; height: 1080px; background: #0a0705; }
      #shake, #stage { position: absolute; inset: 0; }
      .plate { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
      .chip { position: absolute; white-space: nowrap; padding: 14px 22px 12px; background: #f7f3ea; color: #1f2430; font: 800 46px/1 "Bricolage", sans-serif; letter-spacing: -.01em;

      #leak { position: absolute; left: -10%; top: -30%; width: 70%; height: 120%; background: radial-gradient(closest-side, rgba(255,170,90,.22), rgba(255,140,60,0)); mix-blend-mode: screen; pointer-events: none; }
      #grain { position: absolute; inset: 0; opacity: .085; mix-blend-mode: overlay; pointer-events: none; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.42) 100%); pointer-events: none; }
      .scrim { position: absolute; left: -260px; bottom: -300px; width: 1500px; height: 640px; background: radial-gradient(closest-side, rgba(0,0,0,.6), rgba(0,0,0,0)); pointer-events: none; }
      #lt .lt { position: absolute; left: 84px; bottom: 82px; color: #fff; }
      #lt .k { display: block; font: 700 21px/1 "Mono", monospace; letter-spacing: .14em; color: #f6c453; margin-bottom: 16px; }
      #lt .t { display: block; font: 800 64px/1 "Bricolage", sans-serif; letter-spacing: -.025em; }
      #tag { position: absolute; right: 64px; bottom: 44px; font: 700 18px/1 "Mono", monospace; letter-spacing: .1em; color: rgba(255,255,255,.85); background: rgba(10,8,6,.55); padding: 10px 14px; border-radius: 6px; }
      #kick { position: absolute; left: 64px; top: 52px; font: 700 20px/1 "Mono", monospace; letter-spacing: .12em; color: #f6c453; }
    </style>
  </head>
  <body>

      <div class="vig"></div>
      <div id="grain"></div>
      <div class="scrim"></div>
      <div id="lt"></div>
      <div id="kick"></div>
      <div id="tag"></div>
