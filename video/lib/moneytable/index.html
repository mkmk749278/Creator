<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Money Table: photoreal desk, coins, bill, phone</title>
    <!--
      "The Money Table" (owner, 2026-10-12: ultra realistic, our own method, no ceiling). Money is shown as physical
      objects on a real desk: a printed bill, a phone, metal coins that move, printed tent cards. Words live on objects,
      not on top of the picture. Proof beat: every ₹100 you pay on a minimum-only card = ₹74 to interest + GST, ₹26 to the
      loan (projects/minimum-due/tools/mad_math.py, OUR CALCULATION).
      Stack: three 0.181.2, HDRI + PBR walnut (Poly Haven, CC0), soft shadows, pmndrs bloom/DOF/vignette/AgX.
      window.BENCH = {dof: 0, bloom: 0} turns passes off for cost measurement.
    -->
    <script src="vendor/gsap.min.js"></script>
    <script src="params.js"></script>
    <script type="importmap">
      { "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/jsm/",
          "postprocessing": "./vendor/pp/postprocessing.js",
          "simplex-noise": "./vendor/noise/simplex-noise.js"
      } }
    </script>
    <style>
      @font-face { font-family: "Bricolage"; font-weight: 800; src: url("vendor/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Bricolage"; font-weight: 800; src: url("vendor/fonts/bricolage-grotesque-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+20B9, U+0100-024F; }
      @font-face { font-family: "Mono"; font-weight: 700; src: url("vendor/fonts/jetbrains-mono-latin-700-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("vendor/fonts/inter-tight-latin-800-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter Tight"; font-weight: 800; src: url("vendor/fonts/inter-tight-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+20B9, U+2212, U+0100-024F; }
      html, body { margin: 0; background: #0b0806; }
      #root { position: relative; overflow: hidden; background: #0b0806; color: #fff; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .scrim { position: absolute; left: -260px; bottom: -300px; width: 1500px; height: 640px; background: radial-gradient(closest-side, rgba(0,0,0,.55), rgba(0,0,0,0)); }
      .lt { position: absolute; left: 84px; bottom: 82px; }
      .lt .k { display: block; font: 700 21px/1 "Mono", monospace; letter-spacing: .14em; color: #f6c453; margin-bottom: 16px; }
      .lt .t { display: block; font: 800 64px/1 "Bricolage", "Inter Tight", sans-serif; letter-spacing: -.025em; }
      .tag { position: absolute; right: 64px; top: 52px; font: 700 18px/1 "Mono", monospace; letter-spacing: .1em; color: rgba(255,255,255,.82);
        background: rgba(10,8,6,.5); padding: 10px 14px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="moneytable" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <canvas id="gl"></canvas>
      <div class="scrim"></div>
      <div class="lt" id="lt"><span class="k" id="lt-k"></span><span class="t" id="lt-t"></span></div>
      <div class="tag" id="tag"></div>
    </div>
    <script>
      const S = window.SCENE;
      document.getElementById("lt-k").textContent = S.kicker;
      document.getElementById("lt-t").textContent = S.title;
      document.getElementById("tag").textContent = S.tag;
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#lt-k", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.7, ease: "expo.out" }, 0.5);
      tl.fromTo("#lt-t", { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.9, ease: "expo.out" }, 0.62);
      tl.fromTo("#tag", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 0.3);
      tl.to({}, { duration: S.duration }, 0);
      window.__timelines["moneytable"] = tl;
    </script>
    <script type="module">
      import * as THREE from "three";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { EffectComposer, RenderPass, EffectPass, BloomEffect, ToneMappingEffect, ToneMappingMode, VignetteEffect, DepthOfFieldEffect } from "postprocessing";
      import { createNoise2D } from "simplex-noise";

      const S = window.SCENE, B = window.BENCH || {};
      const root = document.getElementById("root");
      const W = +root.dataset.width, H = +root.dataset.height;
      const mulberry32 = (s) => () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rng = mulberry32(11), noise = createNoise2D(mulberry32(5));
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => 1 - Math.pow(1 - clamp(x), 4);            // ≈ cubic-bezier(.16,1,.3,1)
      const inout = (x) => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };

      const mgr = THREE.DefaultLoadingManager;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, stencil: false, depth: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.NoToneMapping;
      renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b0806);
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 40);

      // ---- fonts for the printed textures (loaded through the default manager so HyperFrames waits for them) ----
      const fontFiles = [["Bricolage", "vendor/fonts/bricolage-grotesque-latin-800-normal.woff2"], ["Bricolage", "vendor/fonts/bricolage-grotesque-latin-ext-800-normal.woff2"],
        ["Inter Tight", "vendor/fonts/inter-tight-latin-800-normal.woff2"], ["Inter Tight", "vendor/fonts/inter-tight-latin-ext-800-normal.woff2"],
        ["Mono", "vendor/fonts/jetbrains-mono-latin-700-normal.woff2"]];
      const fontsReady = Promise.all(fontFiles.map(([fam, f]) => new THREE.FileLoader(mgr).setResponseType("arraybuffer")
        .loadAsync(f).then((buf) => { const ff = new FontFace(fam, buf, { weight: "800" }); document.fonts.add(ff); return ff.load(); })));
      const HEAD = '800 X "Bricolage", "Inter Tight", sans-serif', NUM = '800 X "Inter Tight", sans-serif', MONO = '700 X "Mono", monospace';
      const font = (f, px) => f.replace("X", px + "px");

      const canvasTex = (w, h, draw, srgb = true) => { const c = document.createElement("canvas"); c.width = w; c.height = h; draw(c.getContext("2d"), w, h);
        const t = new THREE.CanvasTexture(c); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };

      // ---- desk: walnut veneer (Poly Haven CC0) ----
      const tl = new THREE.TextureLoader(mgr);
      const WOOD = { diff: "vendor/library/texture/american_walnut_veneer_diff_1k.jpg", nor_gl: "vendor/library/texture/american_walnut_veneer_nor_gl_1k.jpg", rough: "vendor/library/texture/american_walnut_veneer_rough_1k.jpg" };
      const wood = (m, srgb) => { const t = tl.load(WOOD[m]); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 3.4); if (srgb) t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t; };
      const desk = new THREE.Mesh(new THREE.PlaneGeometry(16, 11), new THREE.MeshStandardMaterial({ map: wood("diff", true), color: 0x8a5a3a, normalMap: wood("nor_gl"), roughnessMap: wood("rough"), roughness: 0.75, envMapIntensity: 0.6 }));
      desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true; scene.add(desk);

      // ---- lights: warm practical key (soft shadow), cool fill from the HDRI, back rim ----
      const key = new THREE.SpotLight(0xffcf96, 90, 14, 0.62, 0.75, 1.6); key.position.set(-1.6, 5.2, 2.4); key.target.position.set(-0.3, 0, 0.5); scene.add(key.target); key.castShadow = true;
      key.shadow.mapSize.set(2048, 2048); key.shadow.radius = 6; key.shadow.bias = -0.0004; key.shadow.normalBias = 0.01;
      Object.assign(key.shadow.camera, { near: 1, far: 14 }); scene.add(key);
      const rim = new THREE.DirectionalLight(0x9cc4ff, 0.9); rim.position.set(2.5, 2.2, -3.5); scene.add(rim);

      const ready = Promise.all([fontsReady, new HDRLoader(mgr).loadAsync("vendor/library/hdri/small_empty_room_1_1k.hdr").then((tex) => {
        const pm = new THREE.PMREMGenerator(renderer); scene.environment = pm.fromEquirectangular(tex).texture; scene.environmentIntensity = 0.32; tex.dispose(); pm.dispose(); })]);

      ready.then(() => {
        // ---- the bill: printed paper with a slight curl ----
        const billTex = canvasTex(1536, 2048, (g, w, h) => {
          g.fillStyle = "#f4f1ea"; g.fillRect(0, 0, w, h);
          for (let i = 0; i < 4000; i++) { g.fillStyle = `rgba(120,110,95,${rng() * 0.05})`; g.fillRect(rng() * w, rng() * h, 2, 2); }
          g.fillStyle = "#1b2a41"; g.fillRect(0, 0, w, 230);
          g.fillStyle = "#fff"; g.font = font(HEAD, 84); g.fillText("CREDIT CARD BILL", 90, 145);
          g.fillStyle = "#6b7280"; g.font = font(MONO, 34); g.fillText(S.billNote, 90, 320); g.fillText("BILL DATE  25 NOV", 90, 380);
          let y = 560;
          for (const [a, b, hi] of S.billRows) {
            if (hi) { g.fillStyle = "rgba(250,204,21,.55)"; g.fillRect(70, y - 74, w - 140, 104); }
            g.fillStyle = "#111827"; g.font = font(NUM, 56); g.fillText(a, 90, y); const tw = g.measureText(b).width; g.fillText(b, w - 90 - tw, y);
            g.fillStyle = "#d6d0c4"; g.fillRect(90, y + 54, w - 180, 3); y += 190;
          }
          g.fillStyle = "#111827"; g.font = font(HEAD, 70); g.fillText("Total amount due", 90, y + 70);
          g.font = font(NUM, 90); const tt = S.billTotal, tw = g.measureText(tt).width; g.fillText(tt, w - 90 - tw, y + 80);
        });
        const billGeo = new THREE.PlaneGeometry(1.5, 2.0, 30, 30); const bp = billGeo.attributes.position;
        for (let i = 0; i < bp.count; i++) { const x = bp.getX(i), y = bp.getY(i); bp.setZ(i, 0.02 * Math.pow((x + 0.75) / 1.5, 3) + 0.006 * (1 + Math.sin(y * 2.2))); }
        billGeo.computeVertexNormals();
        const bill = new THREE.Mesh(billGeo, new THREE.MeshStandardMaterial({ map: billTex, color: 0xd9d4ca, roughness: 0.85 }));
        bill.rotation.set(-Math.PI / 2, 0, 0.16); bill.position.set(-1.2, 0.006, -1.05); bill.castShadow = bill.receiveShadow = true; scene.add(bill);

        // ---- phone, screen up ----
        const phone = new THREE.Group();
        const body = new THREE.Mesh(new RoundedBoxGeometry(0.74, 0.07, 1.52, 6, 0.09), new THREE.MeshPhysicalMaterial({ color: 0x1c1d22, metalness: 0.6, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.2 }));
        body.castShadow = body.receiveShadow = true; phone.add(body);
        const scr = canvasTex(700, 1440, (g, w, h) => {
          g.fillStyle = "#0e1116"; g.fillRect(0, 0, w, h);
          g.fillStyle = "#16a34a"; g.beginPath(); g.arc(w / 2, 470, 110, 0, Math.PI * 2); g.fill();
          g.strokeStyle = "#fff"; g.lineWidth = 22; g.lineCap = "round"; g.beginPath(); g.moveTo(w / 2 - 48, 470); g.lineTo(w / 2 - 10, 512); g.lineTo(w / 2 + 56, 430); g.stroke();
          g.fillStyle = "#fff"; g.textAlign = "center"; g.font = font(NUM, 120); g.fillText(S.phoneAmount, w / 2, 760);
          g.fillStyle = "#9ca3af"; g.font = font(HEAD, 46); g.fillText(S.phoneLine1, w / 2, 850); g.font = font(MONO, 32); g.fillText(S.phoneLine2, w / 2, 920);
        });
        const screen = new THREE.Mesh(new THREE.PlaneGeometry(0.66, 1.36), new THREE.MeshStandardMaterial({ map: scr, emissiveMap: scr, emissive: 0xffffff, emissiveIntensity: 0.9, roughness: 0.15, metalness: 0 }));
        screen.rotation.x = -Math.PI / 2; screen.position.y = 0.0365; phone.add(screen);
        phone.position.set(1.45, 0.035, -0.75); phone.rotation.y = -0.3; scene.add(phone);

        // ---- coins: 100 × ₹1, minted face (map + bump), brass-steel ----
        const face = canvasTex(512, 512, (g, w) => {
          const gr = g.createRadialGradient(w / 2, w / 2, 20, w / 2, w / 2, w / 2); gr.addColorStop(0, "#cfcfd2"); gr.addColorStop(1, "#a9a9ae");
          g.fillStyle = gr; g.fillRect(0, 0, w, w);
          g.strokeStyle = "#7c7c82"; g.lineWidth = 14; g.beginPath(); g.arc(w / 2, w / 2, w / 2 - 30, 0, Math.PI * 2); g.stroke();
          g.fillStyle = "#6f6f75"; g.textAlign = "center"; g.textBaseline = "middle"; g.font = font(NUM, 250); g.fillText("₹", w / 2 - 50, w / 2 + 6);
          g.font = font(NUM, 230); g.fillText("1", w / 2 + 80, w / 2 + 10);
        });
        face.center.set(0.5, 0.5); face.rotation = Math.PI / 2;   // the ₹1 reads upright from the front of the desk
        const R = 0.105, T = 0.017;
        const coinGeo = new THREE.CylinderGeometry(R, R, T, 64, 1);
        const sideMat = new THREE.MeshStandardMaterial({ color: 0xd2d2d8, metalness: 1, roughness: 0.26 });
        const faceMat = new THREE.MeshStandardMaterial({ map: face, bumpMap: face, bumpScale: 2.5, color: 0xffffff, metalness: 1, roughness: 0.3 });
        const N = 100, coins = new THREE.InstancedMesh(coinGeo, [sideMat, faceMat, faceMat], N);
        coins.castShadow = coins.receiveShadow = true; scene.add(coins);

        // start: 10 stacks of 10 in a neat block (₹100); end: interest piles left, loan piles right
        const nInt = S.interestCoins, start = [], end = [], delay = [];
        for (let i = 0; i < N; i++) { const s = Math.floor(i / 10), k = i % 10;
          start.push(new THREE.Vector3(-0.6 + (s % 5) * 0.225, T / 2 + k * T, 0.0 + Math.floor(s / 5) * 0.225)); }
        const pile = (cx, cz, n, cols, base) => { for (let j = 0; j < n; j++) { const s = Math.floor(j / 10), k = j % 10;
          end.push(new THREE.Vector3(cx + (s % cols) * 0.225 + (rng() - .5) * 0.012, T / 2 + k * T, cz + Math.floor(s / cols) * 0.225 + (rng() - .5) * 0.012)); } };
        pile(-1.3, 0.92, nInt, 4, 0); pile(0.62, 0.92, N - nInt, 2, 0);
        // fly order: from the top of the block down (coin i's height rank), interest first, then the loan coins
        const order = [...Array(N).keys()].sort((a, b) => (b % 10) - (a % 10) || a - b);
        order.forEach((ci, r) => { delay[ci] = r < nInt ? S.tInt + r * (S.intSpan / nInt) : S.tLoan + (r - nInt) * (S.loanSpan / (N - nInt)); });
        // map flight targets in the same order
        const target = []; order.forEach((ci, r) => { target[ci] = end[r]; });
        const spin = start.map(() => (rng() < .5 ? 1 : -1) * (1 + Math.floor(rng() * 2)));

        // ---- tent cards (printed, folded) ----
        const tent = (lines, color, x, z) => {
          const tx = canvasTex(1100, 440, (g, w, h) => { g.fillStyle = "#f6f3ec"; g.fillRect(0, 0, w, h);
            g.fillStyle = color; g.fillRect(0, 0, 22, h);
            g.fillStyle = "#4b5563"; g.font = font(MONO, 44); g.fillText(lines[0], 70, 120);
            g.fillStyle = color; g.font = font(NUM, 210); g.fillText(lines[1], 64, 360); });
          const grp = new THREE.Group();
          const front = new THREE.Mesh(new THREE.PlaneGeometry(0.88, 0.35), new THREE.MeshStandardMaterial({ map: tx, color: 0xe8e3d8, roughness: 0.85, side: THREE.DoubleSide }));
          const back = new THREE.Mesh(new THREE.PlaneGeometry(0.88, 0.35), new THREE.MeshStandardMaterial({ color: 0xece7dc, roughness: 0.9, side: THREE.DoubleSide }));
          const fp = new THREE.Group(), bk = new THREE.Group(); front.position.y = -0.175; back.position.y = -0.175; fp.add(front); bk.add(back);
          fp.rotation.x = -0.24; bk.rotation.x = 0.3; front.castShadow = back.castShadow = true;
          const hinge = new THREE.Group(); hinge.position.y = 0.33; hinge.add(fp, bk); grp.add(hinge);
          grp.position.set(x, 0, z); scene.add(grp); return grp;
        };
        const tInt = tent(S.cardInterest, "#c8102e", -0.95, 0.5), tLoan = tent(S.cardLoan, "#1d4ed8", 0.74, 0.5);

        // ---- post ----
        const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
        composer.addPass(new RenderPass(scene, camera));
        const fx = [];
        let dof = null;
        if (B.dof !== 0) { dof = new DepthOfFieldEffect(camera, { worldFocusDistance: 3.0, worldFocusRange: 1.1, bokehScale: 4, resolutionScale: 0.5 }); fx.push(dof); }
        if (B.bloom !== 0) fx.push(new BloomEffect({ intensity: 0.45, luminanceThreshold: 0.85, mipmapBlur: true }));
        fx.push(new VignetteEffect({ darkness: 0.62, offset: 0.22 }), new ToneMappingEffect({ mode: ToneMappingMode.ACES_FILMIC }));
        composer.addPass(new EffectPass(camera, ...fx)); composer.setSize(W, H);

        const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), one = new THREE.Vector3(1, 1, 1), p = new THREE.Vector3(), look = new THREE.Vector3();
        const camKeys = S.camera;   // [{t, pos:[x,y,z], look:[x,y,z]}]
        function camAt(t) {
          let i = 0; while (i < camKeys.length - 2 && t > camKeys[i + 1].t) i++;
          const a = camKeys[i], b = camKeys[i + 1], u = inout((t - a.t) / (b.t - a.t));
          p.fromArray(a.pos).lerp(new THREE.Vector3().fromArray(b.pos), u); look.fromArray(a.look).lerp(new THREE.Vector3().fromArray(b.look), u);
          p.x += 0.012 * noise(t * 0.4, 1); p.y += 0.008 * noise(t * 0.4, 7);   // breathing camera, f(t)
          camera.position.copy(p); camera.lookAt(look);
          if (dof) dof.cocMaterial.worldFocusDistance = camera.position.distanceTo(look);
        }
        function renderAt(t) {
          for (let i = 0; i < N; i++) {
            const u = clamp((t - delay[i]) / S.flight), k = inout(u);
            p.copy(start[i]).lerp(target[i], k); p.y += Math.sin(Math.PI * k) * (0.45 + 0.1 * (i % 3));
            e.set(spin[i] * Math.PI * 2 * k, 0, 0.3 * Math.sin(Math.PI * k)); q.setFromEuler(e);
            m4.compose(p, q, one); coins.setMatrixAt(i, m4);
          }
          coins.instanceMatrix.needsUpdate = true;
          for (const [c, t0] of [[tInt, S.tCardInt], [tLoan, S.tCardLoan]]) { const u = ease((t - t0) / 0.7); c.visible = u > 0.001; c.scale.y = Math.max(0.001, u); }
          camAt(t); composer.render();
        }
        window.addEventListener("hf-seek", (ev) => renderAt(ev.detail.time));
        renderAt(window.__hfThreeTime || 0);
      });
    </script>
  </body>
</html>
