<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>A5 Bima Bharosa: tracks, does not decide</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/fin/fin.js"></script>
    <style>
/*KIT_CSS*/
/* A5: O017 (film 158.72-182.26). A complaint ticket goes from the phone to the insurer's tray; the regulator's record
   follows it. No portal UI is imitated: the phone shows an abstract ticket only. */
#stage { position: absolute; inset: 0; transform-origin: 50% 50%; }
#phone { position: absolute; left: 190px; top: 170px; width: 380px; height: 780px; border-radius: 52px; background: #0d1119; padding: 13px;
  box-shadow: 0 50px 90px rgba(0,0,0,.6), 0 0 0 2px #2b3342; }
#screen { position: relative; width: 100%; height: 100%; border-radius: 40px; overflow: hidden; background: linear-gradient(#e9eef5, #c9d3df); }
#screen .notch { position: absolute; left: 50%; top: 10px; width: 96px; height: 28px; margin-left: -48px; border-radius: 16px; background: #0d1119; }
.tk { position: absolute; left: 22px; right: 22px; border-radius: 20px; background: #fff; padding: 20px 22px; box-shadow: 0 4px 14px rgba(20, 38, 59, .12); border-left: 8px solid var(--teal); }
.tk .bar { height: 12px; margin: 10px 0; }
#tk1 { top: 110px; } #tk2 { top: 300px; border-left-color: var(--mist); }
#tray { position: absolute; left: 1230px; top: 600px; width: 520px; height: 330px; }
#tray .back { position: absolute; left: 30px; top: 0; width: 460px; height: 250px; border-radius: 8px; background: linear-gradient(#2a3f58, #1a2a3e); }
#tray .front { position: absolute; left: 0; bottom: 0; width: 520px; height: 150px; border-radius: 10px; background: linear-gradient(#34506f, #1e3249);
  box-shadow: 0 30px 60px rgba(0,0,0,.5), inset 0 2px 0 rgba(255,255,255,.12); }
#tray .doc { position: absolute; width: 400px; height: 220px; border-radius: 4px; }
#cutPiece { position: absolute; left: 110px; top: 40px; width: 330px; height: 70px; background: var(--coral); opacity: .9; border-radius: 3px;
  clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%, 3% 80%, 0 60%, 4% 40%, 0 20%); }
#ledger { left: 1250px; top: 110px; width: 470px; height: 380px; padding: 40px 40px; }
#ledger .row { position: relative; height: 40px; border-bottom: 2px solid rgba(28, 37, 51, .12); display: flex; align-items: center; gap: 16px; }
#ledger .row i { display: block; height: 12px; border-radius: 6px; background: rgba(28, 37, 51, .2); }
#ourRow { position: absolute; left: 30px; right: 30px; top: 197px; height: 44px; border-radius: 6px; background: rgba(89, 220, 195, .38); transform-origin: 0 50%; }
#pDot { position: absolute; left: 40px; top: 211px; width: 16px; height: 16px; border-radius: 50%; background: #1e8f7c; }
#ticket { position: absolute; left: 0; top: 0; width: 160px; height: 96px; padding: 16px 18px; border-left: 8px solid var(--teal); }
#ticket .bar { height: 10px; margin: 8px 0; }
#reply { position: absolute; left: 0; top: 0; width: 140px; height: 84px; padding: 14px 16px; border-left: 8px solid var(--mist); }
#reply .bar { height: 10px; margin: 8px 0; }
#paths { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
#gavel { position: absolute; left: 820px; top: 330px; width: 280px; height: 280px; }
#order { left: 790px; top: 230px; width: 360px; height: 470px; padding: 48px 44px; }
#seal { position: absolute; right: 40px; bottom: 44px; width: 120px; height: 120px; border-radius: 50%; border: 5px dashed rgba(28, 37, 51, .35); }
#cap { left: 64px; bottom: 64px; gap: 0; }
#cap .a { color: var(--teal); }
#cap .b { display: inline-block; overflow: hidden; line-height: 1.2; padding-bottom: 4px; color: var(--paper); white-space: nowrap; vertical-align: bottom; }
#cap .src { margin-left: 18px; }
    </style>
  </head>
  <body>
    <div id="root" class="io-root" data-composition-id="A5_bima_tracker" data-start="0" data-width="1920" data-height="1080" data-duration="23.54">
      <div class="layer"><video id="a5-bg" class="bgv" src="media/desk_f10.mp4" muted playsinline data-start="0" data-duration="23.54" data-track-index="0" data-volume="0"></video></div>
      <div class="layer" id="ov">
        <div class="grade" style="background: radial-gradient(ellipse at 40% 30%, rgba(255, 214, 160, .06), rgba(11, 20, 34, .7) 55%, rgba(5, 9, 16, .9) 100%)"></div>
        <div class="leak" id="leak" style="left: -600px; top: -800px"></div>
        <div id="stage">
          <div id="phone"><div id="screen"><div class="notch"></div>
            <div class="tk" id="tk1"><div class="bar" style="width: 60%; background: rgba(20,38,59,.45)"></div><div class="bar" style="width: 90%"></div><div class="bar" style="width: 72%"></div></div>
            <div class="tk" id="tk2"><div class="bar" style="width: 50%; background: rgba(20,38,59,.35)"></div><div class="bar" style="width: 84%"></div></div>
          </div></div>
          <div class="paper" id="ledger">
            <div class="row"><i style="width: 90px"></i><i style="width: 160px"></i><i style="width: 70px"></i></div>
            <div class="row"><i style="width: 120px"></i><i style="width: 110px"></i><i style="width: 90px"></i></div>
            <div class="row"><i style="width: 80px"></i><i style="width: 170px"></i><i style="width: 60px"></i></div>
            <div class="row"><i style="width: 110px"></i><i style="width: 130px"></i><i style="width: 80px"></i></div>
            <div class="row"><i style="width: 95px"></i><i style="width: 150px"></i><i style="width: 70px"></i></div>
            <div class="row"><i style="width: 130px"></i><i style="width: 100px"></i><i style="width: 85px"></i></div>
            <div id="ourRow"></div><div id="pDot"></div>
          </div>
          <div id="tray"><div class="back"></div>
            <div class="paper doc" style="left: 60px; top: 10px; transform: rotate(3deg)"></div>
            <div class="paper doc" style="left: 80px; top: 30px; transform: rotate(-4deg)"></div>
            <div id="cutPiece"></div>
            <div class="front"></div></div>
          <svg id="paths" viewBox="0 0 1920 1080">
            <path id="route" d="M 560 520 C 820 520, 1050 900, 1440 690" fill="none" stroke="#B8C7D9" stroke-width="5" stroke-dasharray="2 16" stroke-linecap="round" opacity="0"/>
            <path id="track" d="M 1480 480 C 1560 540, 1560 600, 1490 680" fill="none" stroke="#59DCC3" stroke-width="7" stroke-dasharray="3 14" stroke-linecap="round" opacity="0"/>
            <path id="trackB" d="M 1300 470 C 1150 560, 1000 700, 1000 760" fill="none" stroke="#59DCC3" stroke-width="5" stroke-dasharray="3 14" stroke-linecap="round" opacity="0"/>
          </svg>
          <div class="paper" id="ticket"><div class="bar" style="width: 70%; background: rgba(20,38,59,.45)"></div><div class="bar" style="width: 92%"></div><div class="bar" style="width: 64%"></div></div>
          <div class="paper" id="reply"><div class="bar" style="width: 64%; background: rgba(20,38,59,.4)"></div><div class="bar" style="width: 90%"></div></div>
          <svg id="gavel" viewBox="0 0 280 280">
            <g fill="#B8C7D9" opacity=".92">
              <g transform="rotate(-32 140 130)">
                <rect x="58" y="58" width="164" height="60" rx="16"/>
                <rect x="78" y="54" width="14" height="68" rx="5" fill="#8fa3bb"/><rect x="188" y="54" width="14" height="68" rx="5" fill="#8fa3bb"/>
                <rect x="129" y="114" width="22" height="130" rx="10"/>
              </g>
              <rect x="40" y="236" width="170" height="24" rx="8" fill="#8fa3bb"/>
            </g>
            <path id="strike" d="M 30 250 L 250 30" stroke="#F5F7FB" stroke-width="14" stroke-linecap="round" fill="none"/>
          </svg>
          <div class="paper" id="order">
            <div class="bar" style="width: 56%; height: 20px; background: rgba(20,38,59,.5)"></div>
            <div class="bar" style="width: 92%"></div><div class="bar" style="width: 80%"></div><div class="bar" style="width: 88%"></div><div class="bar" style="width: 66%"></div><div class="bar" style="width: 84%"></div>
            <div id="seal"></div>
          </div>
        </div>
        <div class="scrim"></div>
        <div class="chip" id="cap"><span class="a">TRACKS</span><span class="b" id="capB">&nbsp;· DOES NOT DECIDE</span><span class="src">[BIMA BHAROSA | IRDAI]</span></div>
        <canvas class="grain" id="grain" width="500" height="290"></canvas>
        <div class="vig"></div>
      </div>
    </div>
    <script>
/*KIT_JS*/
      const $ = (id) => document.getElementById(id), D = 23.54;
      // Beats (local = film - 158.72): useful 159.95 -> 1.23; record 161.95 -> 3.23; answer ~164.3 -> 5.6;
      // NOT a court 166.57 -> 7.85 ("court" ~168.7 -> 10.0); same company 169.55 -> 10.83; "cut your claim" ~172.4 -> 13.7;
      // "tracks" ~173.8 -> 15.1; does not decide 176.82 -> 18.1; "does not pass an order" ~179.4 -> 20.7.
      const T = { useful: 1.23, record: 3.23, answer: 5.6, court: 7.85, strike: 9.8, same: 10.83, cut: 13.7, tracks: 15.0, decide: 18.1, order: 20.7 };
      FIN.grain($("grain"));
      IO.motes($("ov"), 22, 31, { x: 0, y: 100, w: 1920, h: 900 }, 0.6);
      IO.drift($("stage"), 5, 12);
      const route = $("route"), rLen = route.getTotalLength();
      const P = (u) => route.getPointAtLength(u * rLen);
      // the ticket rides the route: position is a pure function of the proxy's u
      const ride = { u: 0 }, back = { u: 1 };
      FIN.hook(() => { const p = P(ride.u); $("ticket").style.transform = `translate(${(p.x - 80).toFixed(1)}px, ${(p.y - 48).toFixed(1)}px) rotate(${(-6 + 10 * ride.u).toFixed(2)}deg)`;
        const q = P(back.u); $("reply").style.transform = `translate(${(q.x - 70).toFixed(1)}px, ${(q.y - 42).toFixed(1)}px) rotate(${(4 - 8 * back.u).toFixed(2)}deg)`; });
      const tl = gsap.timeline({ paused: true });
      const pop = (el, t, from = { opacity: 0, y: 30 }) => tl.fromTo(el, from, { opacity: 1, y: 0, x: 0, scale: 1, duration: 0.5, ease: "power3.out", immediateRender: false }, t);
      gsap.set(["#ticket", "#reply", "#gavel", "#order", "#cap", "#ourRow", "#pDot"], { opacity: 0 });
      gsap.set("#capB", { width: 0 }); gsap.set("#cutPiece", { rotation: -7 });

      // camera: a slow drift across the desk, a lean in for "NOT a court", back out for the route
      tl.fromTo($("stage"), { scale: 1.06, x: 40 }, { scale: 1.0, x: 0, duration: T.court, ease: "sine.inOut" }, 0);
      tl.to($("stage"), { scale: 1.08, duration: T.same - T.court, ease: "sine.inOut" }, T.court);
      tl.to($("stage"), { scale: 1.02, x: -30, duration: T.decide - T.same, ease: "sine.inOut" }, T.same);
      tl.to($("stage"), { scale: 1.1, x: 0, duration: D - T.decide, ease: "sine.inOut" }, T.decide);
      tl.fromTo($("leak"), { x: 0 }, { x: 300, duration: D, ease: "none" }, 0);
      // "Bima Bharosa is useful": the complaint ticket on the phone
      tl.fromTo($("phone"), { y: 120, opacity: 0, rotation: -4 }, { y: 0, opacity: 1, rotation: -6, duration: 0.8, ease: "power3.out" }, 0.1);
      tl.fromTo($("tk1"), { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.5, ease: "power3.out" }, T.useful);
      tl.fromTo($("ledger"), { y: -60, opacity: 0, rotation: 2 }, { y: 0, opacity: 1, rotation: 2, duration: 0.7, ease: "power3.out" }, T.record - 0.4);
      tl.fromTo($("tray"), { y: 80, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out" }, T.record - 0.2);
      // "on the regulator's record": our row is written into the ledger
      tl.fromTo($("ourRow"), { opacity: 1, scaleX: 0 }, { opacity: 1, scaleX: 1, duration: 0.7, ease: "power2.inOut", immediateRender: false }, T.record + 1.2);
      // "the company has to answer it": a reply comes back to the phone
      tl.to($("reply"), { opacity: 1, duration: 0.25 }, T.answer);
      tl.fromTo(back, { u: 1 }, { u: 0.02, duration: 1.4, ease: "power2.inOut", immediateRender: false }, T.answer);
      tl.to($("reply"), { opacity: 0, duration: 0.3 }, T.answer + 1.35);
      tl.fromTo($("tk2"), { x: 300, opacity: 0 }, { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" }, T.answer + 1.3);
      // "But Bima Bharosa is NOT a court": the gavel appears and is struck through
      tl.fromTo($("gavel"), { opacity: 0, scale: 0.85 }, { opacity: 1, scale: 1, duration: 0.45, ease: "power3.out", immediateRender: false }, T.court + 0.1);
      tl.fromTo($("strike"), { attr: { "stroke-dasharray": "312 312", "stroke-dashoffset": 312 } }, { attr: { "stroke-dashoffset": 0 }, duration: 0.35, ease: "power2.out" }, T.strike);
      tl.to($("gavel"), { opacity: 0, scale: 0.9, duration: 0.5, ease: "power2.in" }, T.same - 0.4);
      // "goes to the same insurance company that cut your claim": the ticket travels to the insurer's tray
      tl.to(route, { opacity: 0.8, duration: 0.4 }, T.same);
      tl.to($("ticket"), { opacity: 1, duration: 0.25 }, T.same);
      tl.fromTo(ride, { u: 0 }, { u: 1, duration: 2.2, ease: "power1.inOut", immediateRender: false }, T.same + 0.1);
      tl.fromTo($("cutPiece"), { scale: 1, rotation: -7 }, { scale: 1.08, rotation: -7, duration: 0.25, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, T.cut);
      // "the IRDAI tracks how the company handles it": the record follows the ticket
      tl.to($("track"), { opacity: 1, duration: 0.4 }, T.tracks - 0.3);
      tl.fromTo($("track"), { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -170 }, duration: D - T.tracks, ease: "none", immediateRender: false }, T.tracks - 0.3);
      tl.to($("pDot"), { opacity: 1, duration: 0.3 }, T.tracks);
      tl.fromTo($("pDot"), { x: 0 }, { x: 330, duration: D - T.tracks - 0.5, ease: "none", immediateRender: false }, T.tracks);
      tl.to($("cap"), { opacity: 1, duration: 0.45, ease: "power3.out" }, T.tracks);
      tl.fromTo($("cap"), { y: 24 }, { y: 0, duration: 0.45, ease: "power3.out", immediateRender: false }, T.tracks);
      // "does not decide your claim": the caption completes; an order paper waits with an empty seal
      tl.to($("capB"), { width: "auto", duration: 0.6, ease: "power2.out" }, T.decide);
      tl.to(route, { opacity: 0.35, duration: 0.5 }, T.decide);
      tl.fromTo($("order"), { opacity: 0, y: 60, rotation: 4 }, { opacity: 1, y: 0, rotation: -2, duration: 0.7, ease: "power3.out", immediateRender: false }, T.decide + 0.3);
      // "does not pass an order": the seal stays empty
      tl.fromTo($("seal"), { opacity: 1 }, { opacity: 0.25, duration: 0.3, yoyo: true, repeat: 3, ease: "sine.inOut", immediateRender: false }, T.order);
      tl.to($("order"), { opacity: 0.65, y: 20, duration: D - T.order - 1, ease: "sine.inOut" }, T.order + 1);
      tl.to({}, { duration: 0.01 }, D - 0.01);
      FIN.attach(tl);
      window.__timelines["A5_bima_tracker"] = tl;
    </script>
  </body>
</html>
