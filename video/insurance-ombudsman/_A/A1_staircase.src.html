<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>A1 staircase: the four-step plan, step 4 lit</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/fin/fin.js"></script>
    <style>
/*KIT_CSS*/
/* A1: the four-step staircase. 0-21.7 s = O002 (film 15.44-37.14); 21.7-28.32 s = O009 (film 82.92-89.54). */
#room { position: absolute; inset: 0; background:
  radial-gradient(ellipse at 70% 30%, rgba(40, 66, 96, .55), rgba(11, 20, 34, 0) 60%),
  linear-gradient(#0f1c2e 0%, #0B1422 62%, #08101b 100%); }
#floor { position: absolute; left: -200px; right: -200px; top: 860px; height: 400px; background: linear-gradient(#13233a, #070d16); }
#wallTex { position: absolute; inset: 0; opacity: .5; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='400' height='400'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.012 .04' numOctaves='3' seed='9'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .6  0 0 0 0 .75  0 0 0 .08 0'/></filter><rect width='400' height='400' filter='url(%23n)'/></svg>"); }
.shaft { position: absolute; width: 520px; height: 1700px; top: -380px; transform-origin: 50% 0; mix-blend-mode: screen; pointer-events: none;
  background: linear-gradient(90deg, rgba(255, 228, 180, 0), rgba(255, 228, 180, .16) 30%, rgba(255, 228, 180, .22) 50%, rgba(255, 228, 180, .12) 70%, rgba(255, 228, 180, 0)); }
.haze { position: absolute; left: -300px; width: 2600px; height: 360px; border-radius: 50%; pointer-events: none;
  background: radial-gradient(ellipse, rgba(184, 199, 217, .10), rgba(184, 199, 217, 0) 70%); }
#cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
#stairs { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
#flood { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, rgba(220, 255, 247, .95), rgba(89, 220, 195, .75) 45%, rgba(89, 220, 195, .2) 100%); opacity: 0; }
#chip4 { left: 64px; bottom: 64px; color: var(--teal); border-color: rgba(89, 220, 195, .45); }
#chip4b { left: 64px; bottom: 64px; color: var(--teal); border-color: rgba(89, 220, 195, .45); }
    </style>
  </head>
  <body>
    <div id="root" class="io-root" data-composition-id="A1_staircase" data-start="0" data-width="1920" data-height="1080" data-duration="28.32">
      <div id="room"><div id="wallTex"></div></div>
      <div id="cam">
        <div id="floor"></div>
        <div class="shaft" id="sh1" style="left: 300px"></div>
        <div class="shaft" id="sh2" style="left: 900px; width: 300px"></div>
        <svg id="stairs" viewBox="0 0 1920 1080">
          <g id="doorG" opacity="0">
            <defs>
              <linearGradient id="dLight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e9fffa"/><stop offset="1" stop-color="#59DCC3"/></linearGradient>
              <filter id="dGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="22"/></filter>
            </defs>
            <rect x="1360" y="40" width="210" height="330" rx="4" fill="#59DCC3" filter="url(#dGlow)" opacity=".8"/>
            <rect x="1370" y="50" width="190" height="320" fill="url(#dLight)"/>
            <rect id="doorPanel" x="1370" y="50" width="190" height="320" fill="#1d3550" stroke="#0B1422" stroke-width="3"/>
            <rect x="1360" y="40" width="210" height="330" fill="none" stroke="#2c4868" stroke-width="12"/>
            <polygon id="spill" points="1370,370 1560,370 1640,470 1290,470" fill="#59DCC3" opacity="0"/>
          </g>
        </svg>
        <div class="haze" id="hz1" style="top: 640px"></div>
        <div class="haze" id="hz2" style="top: 820px; opacity: .7"></div>
      </div>
      <div class="layer" id="ov">
        <div id="flood"></div>
        <div class="scrim"></div>
        <div class="chip" id="chip4">STEP 4: INSURANCE OMBUDSMAN · FREE</div>
        <div class="chip" id="chip4b">STEP 4</div>
        <canvas class="grain" id="grain" width="500" height="290"></canvas>
        <div class="vig"></div>
      </div>
    </div>
    <script>
/*KIT_JS*/
      const $ = (id) => document.getElementById(id), D = 28.32, svg = $("stairs");
      // O002 beats (local = film - 15.44): plan 24.06 -> 8.62; papers 27.73 -> 12.29; reimbursement 29.06 -> 13.62;
      // Bima Bharosa 32.31 -> 16.87; step four 34.42 -> 18.98; Ombudsman 35.46 -> 20.02.
      // O009 (local = film - 82.92 + 21.7): stop 83.17 -> 21.95; third one 84.47 -> 23.25; step four 87.9 -> 26.68.
      const T = { plan: 8.62, s: [12.29, 13.62, 16.87, 18.98], omb: 20.02, cut: 21.7, stop: 21.95, third: 23.25, four: 26.68 };
      const steps = IO.stairs(svg, { id: "a1" });
      svg.appendChild($("doorG"));            // door sits above step 4's tread
      const file = IO.caseFile(svg, "a1-file", 0.9);
      FIN.grain($("grain"));
      IO.motes($("ov"), 34, 21, { x: 100, y: 100, w: 1700, h: 900 }, 0.7);
      IO.drift($("cam"), 6, 8);
      const tl = gsap.timeline({ paused: true });

      // ---- O002 ----
      // the room in half-dark; light shafts sweep across the staircase while the camera cranes up
      tl.fromTo($("cam"), { scale: 1.16, x: 140, y: 90 }, { scale: 1.0, x: 60, y: 0, duration: T.plan, ease: "sine.inOut" }, 0);
      tl.fromTo($("sh1"), { x: -500, rotation: 18, opacity: 0.4 }, { x: 700, rotation: 12, opacity: 1, duration: T.cut, ease: "none" }, 0);
      tl.fromTo($("sh2"), { x: -300, rotation: 16, opacity: 0.2 }, { x: 500, rotation: 13, opacity: 0.8, duration: T.cut, ease: "none" }, 0);
      tl.fromTo($("hz1"), { x: -200 }, { x: 200, duration: D, ease: "none" }, 0);
      tl.fromTo($("hz2"), { x: 150 }, { x: -150, duration: D, ease: "none" }, 0);
      steps.forEach((s, i) => {
        tl.fromTo(s.g, { opacity: 0.25 }, { opacity: 0.55, duration: T.plan - 1, ease: "none" }, 0);
        // "a four-step plan": the steps rim-light one after another
        tl.to(s.g, { opacity: 1, duration: 0.5, ease: "power2.out" }, T.plan + i * 0.16);
        tl.fromTo(s.edge, { opacity: 0.35 }, { opacity: 0.9, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, T.plan + i * 0.16);
        tl.to(s.num, { opacity: 0.4, duration: 0.4 }, T.plan + i * 0.16);
      });
      // the camera follows the climb
      tl.to($("cam"), { scale: 1.08, x: 120, y: 40, duration: T.s[0] - T.plan, ease: "sine.inOut" }, T.plan);
      tl.to($("cam"), { scale: 1.18, x: -400, y: 106, duration: T.omb + 1.2 - T.s[0], ease: "sine.inOut" }, T.s[0]);
      // light each step in turn; earlier steps fall back to an ember; step 4 (teal) stays lit
      const light = (s, t, on = 1) => {
        tl.fromTo(s.top, { opacity: 0 }, { opacity: 0.55 * on, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo(s.glow, { opacity: 0 }, { opacity: on, duration: 0.35, ease: "power2.out" }, t);
        tl.fromTo(s.pool, { opacity: 0 }, { opacity: on, duration: 0.5, ease: "power2.out" }, t);
        tl.to(s.num, { opacity: 0.95, fill: on ? (s === steps[3] ? "#59DCC3" : "#FFDB59") : "#B8C7D9", duration: 0.3 }, t);
      };
      const ember = (s, t) => {
        tl.to(s.top, { opacity: 0.12, duration: 0.5 }, t); tl.to(s.glow, { opacity: 0.25, duration: 0.5 }, t);
        tl.to(s.pool, { opacity: 0.15, duration: 0.5 }, t); tl.to(s.num, { opacity: 0.45, duration: 0.5 }, t);
      };
      // the case file climbs: drops onto step 1, then hops up with each step
      const fx = (i) => steps[i].cx, fy = (i) => steps[i].topY + 8;
      tl.fromTo(file, { x: fx(0), y: fy(0) - 260, opacity: 0 }, { x: fx(0), y: fy(0), opacity: 1, duration: 0.45, ease: "bounce.out" }, T.s[0] - 0.1);
      for (let i = 0; i < 4; i++) {
        light(steps[i], T.s[i]);
        if (i > 0) {
          ember(steps[i - 1], T.s[i]);
          tl.to(file, { x: fx(i), duration: 0.5, ease: "power1.inOut" }, T.s[i] - 0.25);
          tl.to(file, { keyframes: [{ y: fy(i) - 140, duration: 0.25, ease: "power2.out" }, { y: fy(i), duration: 0.25, ease: "power2.in" }] }, T.s[i] - 0.25);
        }
      }
      tl.fromTo($("chip4"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.omb);

      // ---- O009: hard cut to a closer angle on steps 3-4 ----
      tl.set($("chip4"), { opacity: 0 }, T.cut);
      tl.set($("cam"), { scale: 1.5, x: -510, y: 240 }, T.cut);
      tl.set([steps[0].g, steps[1].g], { opacity: 0.55 }, T.cut);
      tl.set(steps[2].top, { opacity: 0.08 }, T.cut);
      tl.set(file, { x: fx(3) - 70, y: fy(3) }, T.cut);
      tl.to($("cam"), { scale: 1.54, x: -524, y: 246, duration: T.stop - T.cut, ease: "none" }, T.cut);
      // "Stop right there": a snap push
      tl.to($("cam"), { scale: 1.72, x: -585, y: 275, duration: 0.35, ease: "power3.out" }, T.stop);
      tl.to($("cam"), { scale: 1.76, x: -598, y: 282, duration: T.third - T.stop - 0.35, ease: "none" }, T.stop + 0.35);
      // "there is a third one": a door rises out of step 4 and swings open in teal light
      tl.fromTo($("doorG"), { opacity: 0, y: 330 }, { opacity: 1, y: 0, duration: 0.9, ease: "power3.out" }, T.third);
      tl.to($("doorPanel"), { scaleX: 0.12, duration: 1.3, ease: "power2.inOut", transformOrigin: "0% 50%" }, T.third + 1.0);
      tl.to($("spill"), { opacity: 0.2, duration: 1.2, ease: "power2.out" }, T.third + 1.2);
      tl.to($("cam"), { scale: 1.6, x: -808, y: 496, duration: T.four - T.third, ease: "sine.inOut" }, T.third);
      tl.fromTo($("chip4b"), { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, T.four);
      // hand-off to A2: push into the doorway light
      tl.to($("cam"), { scale: 3.2, x: -1616, y: 1056, duration: D - T.four, ease: "power2.in" }, T.four);
      tl.to($("flood"), { opacity: 0.85, duration: 0.9, ease: "power2.in" }, D - 0.9);
      tl.to({}, { duration: 0.01 }, D - 0.01);
      FIN.attach(tl);
      window.__timelines["A1_staircase"] = tl;
    </script>
  </body>
</html>
