<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Stick man: The Paper Plane</title>
    <!--
      Character-animation capability demo (owner, 2026-10-24: "can you make stick-man animations? make a polished
      10-20 s clip"). A hand-drawn stick man on paper: walk cycle with planted feet, catch, puzzle, idea, folding,
      throw with anticipation and follow-through, a loop-the-loop flight, a duck, a bonk and a laugh. Rig and story are in
      stick.js; Rough.js (MIT) draws the background with fixed seeds. Sound: make_audio.py (synthesised, no samples).
    -->
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/rough/rough.js"></script>
    <style>
      @font-face { font-family: "Bricolage"; font-weight: 800; src: url("vendor/fonts/bricolage-grotesque-latin-800-normal.woff2") format("woff2"); }
      html, body { margin: 0; background: #f3efe6; }
      #root { position: relative; overflow: hidden; width: 1920px; height: 1080px; background: #f6f2ea; }
      #paper { position: absolute; inset: -40px; background: url("vendor/doodle/paper.jpg") center / cover; }
      svg { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
      .lbl { font-family: "Bricolage", Arial, sans-serif; font-weight: 800; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(70,48,24,.26) 100%); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="stickman" data-start="0" data-width="1920" data-height="1080" data-duration="18.6" data-fps="60">
      <div id="paper"></div>
      <svg id="s" viewBox="0 0 1920 1080"></svg>
      <div class="vig"></div>
    </div>
    <script src="stick.js"></script>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["stickman"] = window.__stickInit();
    </script>
  </body>
</html>
