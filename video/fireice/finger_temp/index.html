<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Benson's thermometers: finger and toe temperature during Tummo</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="shared/fx.js"></script>
    <script src="shared/body.js"></script>
    <link rel="stylesheet" href="shared/theme.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      canvas { position: absolute; left: 0; top: 0; width: 1100px; height: 1080px; }
      svg.stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
      .sl { position: absolute; font-size: 24px; font-weight: 800; letter-spacing: 0.1em; color: var(--ice); text-shadow: 0 2px 8px rgba(0,0,0,0.9); }
      .big { position: absolute; left: 1120px; top: 120px; font-size: 104px; font-weight: 800; color: var(--flame); text-shadow: 0 4px 20px rgba(0,0,0,0.6); }
      .big small { display: block; font-size: 26px; font-weight: 600; letter-spacing: 0.1em; color: var(--ink-dim); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="finger-temp" data-start="0" data-width="1920" data-height="1080" data-duration="31.2">
      <div class="bg" id="bg"><div class="base"></div><div class="glow-c"></div><div class="glow-h" id="gh"></div><div class="grid"></div></div>
      <div class="particles" id="snow"></div>
      <canvas id="cv" width="1100" height="1080"></canvas>
      <svg class="stage" id="svg" viewBox="0 0 1920 1080">
        <g id="sensors"></g>
        <g id="chart" opacity="0">
          <rect x="1080" y="300" width="760" height="470" rx="14" fill="rgba(3,8,15,0.55)" stroke="rgba(157,179,199,0.3)"/>
          <line x1="1150" y1="700" x2="1800" y2="700" stroke="rgba(157,179,199,0.6)" stroke-width="3"/>
          <line x1="1150" y1="340" x2="1150" y2="700" stroke="rgba(157,179,199,0.6)" stroke-width="3"/>
          <line id="base" x1="1150" y1="560" x2="1800" y2="560" stroke="rgba(157,179,199,0.35)" stroke-width="2" stroke-dasharray="8 8"/>
          <text x="1160" y="740" font-family="Inter" font-weight="800" font-size="22" fill="#9db3c7" letter-spacing="2">TIME →</text>
          <text x="1160" y="330" font-family="Inter" font-weight="800" font-size="22" fill="#9db3c7" letter-spacing="2">FINGER TEMPERATURE ↑</text>
          <path id="cold" d="M1150 560 C 1300 565, 1420 600, 1560 640 S 1760 670, 1800 675" fill="none" stroke="#8fdcff" stroke-width="6" stroke-dasharray="14 10"/>
          <text id="coldT" x="1170" y="650" font-family="Inter" font-weight="800" font-size="24" fill="#8fdcff">NORMAL BODY IN COLD</text>
          <path id="hot" d="M1150 560 C 1280 558, 1380 520, 1480 470 S 1700 395, 1800 385" fill="none" stroke="#ffb347" stroke-width="8" stroke-linecap="round"/>
          <text id="hotT" x="1170" y="470" font-family="Inter" font-weight="800" font-size="24" fill="#ffb347">MONKS DURING TUMMO</text>
        </g>
      </svg>
      <div class="sl" id="lf">FINGER</div><div class="sl" id="lt">TOE</div><div class="sl" id="lc">NAVEL</div><div class="sl" id="lb">LOWER BACK</div>
      <div class="big mono" id="big">+0.0 °C<small id="bigs">FINGER &amp; TOE TEMPERATURE · PEAK RISE</small></div>
      <div class="scrim"></div>
      <div class="lt" id="l1"><span class="rule" style="background:#8fdcff"></span>SENSITIVE THERMOMETERS<span class="sub">FINGERS · TOES · NAVEL · LOWER BACK</span></div>
      <div class="lt" id="l2"><span class="rule"></span>HEAT FROM WITHIN<span class="sub" id="l2s">AS IF A CENTRAL HEATING SWITCHED ON</span></div>
      <div class="tag" id="tag">ILLUSTRATIVE CURVE · AS REPORTED</div>
      <div class="vignette"></div>
    </div>
    <script>
      // Parameters (from claims.csv): the peak rise shown on screen
      const P = { riseC: 8.3, riseLabel: "UP TO +8.3 °C", sub: "FINGER & TOE TEMPERATURE · PEAK RISE" };
      const tl = gsap.timeline({ paused: true });
      const D = 31.2, NS = "http://www.w3.org/2000/svg", { ss, lerp } = FX;
      FX.drift(tl, "#bg", D);
      FX.dust(tl, document.getElementById("snow"), { seed: 14, count: 70, dur: D, dir: 1, travel: 300, spread: 200 });
      const body = BODY.make(document.getElementById("cv"), { pose: "seat", x: 560, y: 880, scale: 1.05 });
      // sensors: finger (right hand), toe (foot), chest
      const S = [["lf", 222, -112, 40, 20], ["lt", 70, -72, 40, 30], ["lc", 0, -215, -170, -10], ["lb", -112, -175, -260, 30]];
      const sg = document.getElementById("sensors");
      S.forEach(([id, bx, by, ox, oy], i) => {
        const [x, y] = body.at(bx, by);
        const g = document.createElementNS(NS, "g"); g.setAttribute("class", "sn");
        g.innerHTML = `<circle cx="${x}" cy="${y}" r="14" fill="#8fdcff" stroke="#fff" stroke-width="3"/><circle cx="${x}" cy="${y}" r="26" fill="none" stroke="#8fdcff" stroke-width="2" opacity="0.6"/>` +
          `<path d="M${x} ${y} Q ${x + ox * 2} ${y + 80} ${x + ox * 3} ${y + 160}" fill="none" stroke="rgba(143,220,255,0.55)" stroke-width="3"/>`;
        sg.appendChild(g);
        const el = document.getElementById(id); el.style.left = (x + ox) + "px"; el.style.top = (y + oy - 40) + "px";
        tl.fromTo(g, { opacity: 0, scale: 0.3, transformOrigin: `${x}px ${y}px` }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.5)" }, 1.0 + i * 1.1);
        tl.fromTo(el, { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4 }, 1.2 + i * 1.1);
        tl.to(el, { opacity: 0, duration: 0.4 }, 7.0);
      });
      document.getElementById("bigs").textContent = P.sub;
      FX.clock(tl, D, t => {
        const cool = ss(t, 7.3, 11.3) * (1 - ss(t, 17.5, 20)), rise = ss(t, 17.6, 24.6), whole = ss(t, 24.9, 30.5);
        const base = 0.4 + 0.1 * rise + 0.22 * whole;
        const ext = 0.36 - 0.12 * cool + 0.32 * rise + 0.12 * whole;
        body.draw({ default: base, torso: base + 0.06 + 0.08 * whole, hips: base + 0.04, head: base + 0.02 + 0.06 * whole, armL: lerp(base, ext, 0.5), armR: lerp(base, ext, 0.5),
          handL: ext, handR: ext, footL: ext, footR: ext, legL: lerp(base, ext, 0.4), legR: lerp(base, ext, 0.4) },
          whole > 0 ? [{ x: 0, y: -300, r: 200, t: 0.8 + 0.15 * whole, a: whole }] : [], Math.round(t * 30));
        document.getElementById("big").textContent = "";
        const v = P.riseC * rise;
        document.getElementById("big").innerHTML = (rise > 0.995 ? P.riseLabel : "+" + v.toFixed(1) + " °C") + `<small>${P.sub}</small>`;
        document.getElementById("big").style.display = "none";   // no number on screen: the VO's "8–17 °F" is wrong (fact-check C22)
      });
      tl.fromTo("#chart", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6 }, 7.2);
      FX.draw(tl, "#cold", 7.5, 3.6);
      tl.fromTo("#coldT", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 9.5);
      FX.draw(tl, "#hot", 17.8, 6.4, "power1.inOut");
      tl.fromTo("#hotT", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 21);
      tl.fromTo("#gh", { opacity: 0.2 }, { opacity: 1, duration: 6, ease: "sine.inOut" }, 18);
      tl.fromTo("#l1", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5 }, 0.5);
      tl.to("#l1", { opacity: 0, y: -10, duration: 0.3 }, 6.9);
      tl.fromTo("#l2", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5 }, 25.2);
      window.__timelines["finger-temp"] = tl;
    </script>
  </body>
</html>
