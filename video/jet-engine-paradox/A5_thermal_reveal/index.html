<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>A5 · Gas hotter than the metal's melting point</title>
    <!-- Session A, The Jet Engine Paradox: the core reveal. J053 hold on the blade in its stage, everything slows; 1.5 s of
         stillness; J054 thermal-camera (ironbow) view, temperature scale with the ALLOY MELTING POINT line, the GAS reading
         climbs past it ("melting point" +8.44 s) and stops 200 degrees above; J055 push into the blade surface, METAL stays
         below the line, cyan cooling film. No absolute temperatures. Scale proportions: melt line = 1.0, gas 1.15, metal 0.72
         (fact-check JE-063: Cambridge, turbine entry about 1400 C vs metal about 930 C; Rolls-Royce: up to 200 C above melt).
         Shared model + render stack: jepA.js (master in ../_libA/); HDRI vendor/library/hdri/studio_small_09_1k.hdr ; -->
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/jsm/",
          "postprocessing": "./vendor/pp/postprocessing.js"
      } }
    </script>
    <link rel="stylesheet" href="jep.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      html, body { margin: 0; background: #0B0E14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0B0E14; font-family: Inter, Arial, sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .bar { position: absolute; left: 0; right: 0; height: 132px; background: #020305; }
      #barT { top: 0; } #barB { bottom: 0; }
      /* thermal HUD: corner brackets + centre reticle, low opacity */
      #hud { position: absolute; inset: 0; opacity: 0; }
      .br { position: absolute; width: 70px; height: 70px; border: 0 solid rgba(248,250,252,0.55); }
      .br.tl { left: 150px; top: 180px; border-left-width: 3px; border-top-width: 3px; }
      .br.tr { right: 420px; top: 180px; border-right-width: 3px; border-top-width: 3px; }
      .br.bl { left: 150px; bottom: 180px; border-left-width: 3px; border-bottom-width: 3px; }
      .br.brr { right: 420px; bottom: 180px; border-right-width: 3px; border-bottom-width: 3px; }
      #ret { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; }
      #ret i { position: absolute; background: rgba(248,250,252,0.5); }
      #scan { position: absolute; left: 0; right: 0; top: 0; height: 6px; background: linear-gradient(90deg, rgba(253,224,71,0), rgba(255,251,234,0.95), rgba(253,224,71,0));
        box-shadow: 0 0 40px 14px rgba(249,138,18,0.55); opacity: 0; }
      /* temperature scale (right side, clear of the logo bug and citation corner) */
      #scale { position: absolute; left: 1560px; top: 200px; width: 120px; height: 650px; opacity: 0; }
      #ramp { position: absolute; left: 60px; top: 0; width: 18px; height: 650px; border: 2px solid rgba(248,250,252,0.6);
        background: linear-gradient(0deg, #05030f 0%, #1d0b5a 14%, #5a0f8c 30%, #a8155e 46%, #e0401e 60%, #f88a12 74%, #fcd34d 87%, #fffbea 100%); }
      .tick { position: absolute; left: 82px; height: 2px; background: rgba(248,250,252,0.55); }
      #melt { position: absolute; top: 0; left: -520px; width: 600px; height: 3px; background: var(--white); transform-origin: 100% 50%; }
      #meltLbl { position: absolute; right: 50px; top: -40px; font: 800 24px/1 var(--font); letter-spacing: 0.08em; color: var(--white); white-space: nowrap; }
      .mk { position: absolute; left: -6px; width: 0; height: 0; border-top: 16px solid transparent; border-bottom: 16px solid transparent; }
      .mk b { position: absolute; right: 30px; top: -15px; font: 800 26px/30px var(--font); letter-spacing: 0.08em; white-space: nowrap; }
      #gasMk { border-left: 30px solid #fffbea; } #gasMk b { color: #fffbea; text-shadow: 0 0 18px rgba(249,138,18,0.9); }
      #metMk { border-left: 30px solid #f88a12; } #metMk b { color: #fdba74; }
      #brk { position: absolute; left: 100px; width: 14px; border: 3px solid var(--white); border-left: 0; }
      #brkLbl { position: absolute; left: 124px; font: 800 26px/1 var(--font); color: var(--white); white-space: nowrap; }
      #lbl { bottom: 160px; max-width: 860px; font-size: 36px; }
      #flash { position: absolute; inset: 0; background: #fff7e0; opacity: 0; mix-blend-mode: screen; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="A5_thermal_reveal" data-start="0" data-width="1920" data-height="1080" data-duration="18.09">
      <canvas id="gl"></canvas>
      <div id="flash"></div>
      <div id="hud">
        <div class="br tl"></div><div class="br tr"></div><div class="br bl"></div><div class="br brr"></div>
        <div id="ret"><i style="left:27px;top:0;width:2px;height:18px"></i><i style="left:27px;bottom:0;width:2px;height:18px"></i>
          <i style="top:27px;left:0;height:2px;width:18px"></i><i style="top:27px;right:0;height:2px;width:18px"></i></div>
      </div>
      <div id="scale">
        <div id="ramp"></div>
        <div id="ticks"></div>
        <div id="meltWrap" style="position:absolute;left:0;top:130px;width:120px;">
          <div id="melt"></div><div id="meltLbl">ALLOY MELTING POINT</div>
        </div>
        <div class="mk" id="gasMk"><b>GAS</b></div>
        <div class="mk" id="metMk"><b>METAL</b></div>
        <div id="brk"></div><div id="brkLbl">+200 °C</div>
      </div>
      <div class="jep-label" id="lbl">Gas: up to 200 °C above the metal's melting point</div>
      <div id="scan"></div>
      <div class="bar" id="barT"></div><div class="bar" id="barB"></div>
    </div>
    <script>
      // scale geometry: 650 px tall, top = 1.25 (normalised temperature), melt line = 1.0
      const SH = 650, yOf = (T) => SH - SH * (T / 1.25);
      const ticks = document.getElementById("ticks");
      for (let i = 0; i <= 25; i++) { const d = document.createElement("div"); d.className = "tick"; d.style.top = (SH * i / 25 - 1) + "px";
        d.style.width = (i % 5 === 0 ? 22 : 11) + "px"; ticks.appendChild(d); }
      document.getElementById("meltWrap").style.top = yOf(1.0) + "px";
      const brk = document.getElementById("brk"); brk.style.top = yOf(1.15) + "px"; brk.style.height = (yOf(1.0) - yOf(1.15)) + "px";
      document.getElementById("brkLbl").style.top = (yOf(1.075) - 13) + "px";

      const tl = gsap.timeline({ paused: true });
      // J053 + stillness: 2.35:1 bars slide in as everything slows
      tl.fromTo("#barT", { yPercent: -100 }, { yPercent: 0, duration: 1.4, ease: "power2.inOut" }, 1.0);
      tl.fromTo("#barB", { yPercent: 100 }, { yPercent: 0, duration: 1.4, ease: "power2.inOut" }, 1.0);
      // thermal switch: scan line sweeps down at the start of J054
      tl.fromTo("#scan", { y: 120, opacity: 0 }, { y: 960, opacity: 1, duration: 0.6, ease: "power1.inOut" }, 3.55);
      tl.to("#scan", { opacity: 0, duration: 0.15 }, 4.1);
      tl.fromTo("#hud", { opacity: 0 }, { opacity: 0.55, duration: 0.5 }, 3.9);
      tl.fromTo("#scale", { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.6, ease: "power3.out" }, 4.3);
      tl.fromTo("#melt", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out" }, 4.9);
      tl.fromTo("#meltLbl", { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.45 }, 5.25);
      // GAS climbs from 0.60 and crosses the melt line on "melting point" (+8.4 s), stops at 1.15
      tl.fromTo("#gasMk", { y: yOf(0.60) - 16, opacity: 0 }, { y: yOf(0.60) - 16, opacity: 1, duration: 0.3 }, 5.6);
      tl.fromTo("#gasMk", { y: yOf(0.60) - 16 }, { y: yOf(1.15) - 16, duration: 3.35, ease: "none" }, 5.9);
      tl.fromTo("#melt", { backgroundColor: "#F8FAFC" }, { backgroundColor: "#EF4444", duration: 0.12, yoyo: true, repeat: 3 }, 8.35);
      tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.22, duration: 0.06 }, 8.4);
      tl.to("#flash", { opacity: 0, duration: 0.5 }, 8.46);
      tl.fromTo("#brk", { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.4, ease: "power2.out", transformOrigin: "50% 100%" }, 9.25);
      tl.fromTo("#brkLbl", { opacity: 0, x: -10 }, { opacity: 1, x: 0, duration: 0.4 }, 9.45);
      tl.fromTo("#lbl", { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 8.6);
      tl.to("#lbl", { x: 8, duration: 2.0, ease: "none" }, 9.2);
      tl.to("#lbl", { opacity: 0, x: -20, duration: 0.4 }, 11.2);
      // J055: METAL reading rises and stays below the line
      tl.fromTo("#metMk", { y: yOf(0.30) - 16, opacity: 0 }, { y: yOf(0.30) - 16, opacity: 1, duration: 0.3 }, 12.2);
      tl.fromTo("#metMk", { y: yOf(0.30) - 16 }, { y: yOf(0.72) - 16, duration: 1.3, ease: "power3.out" }, 12.3);
      tl.to("#metMk", { y: yOf(0.735) - 16, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 13.6);
      tl.to("#hud", { opacity: 0.35, duration: 1.0 }, 12.0);
      window.__timelines["A5_thermal_reveal"] = tl;
    </script>
    <script type="module">
      import { THREE, createStage, lightRig, backdrop, buildHotSection, gasStream, fireVolume, filmParticles, setEnv, U, seg, ease, lerp, clamp, wob, aim, DIM } from "./jepA.js";
      const DURN = 18.09;
      const st = createStage({ fov: 22 });
      const { scene, camera } = st;
      const bg = backdrop({ glowDir: [0.2, 0.4, 0.6], glow: 0.5 }); scene.add(bg);
      const L = lightRig(scene, { key: 0.5, rim: 2.6, fill: 0.1 });
      L.key.position.set(-2, 4, -1); L.rim.position.set(3, 2.0, 1.5); L.rim2.position.set(1, 3, 3); L.fill.position.set(-3, -1, -2);
      const hs = buildHotSection(scene, { combustor: false, casing: false, ngv: false, lod: false });
      setEnv(scene, 0.35);
      const glow = new THREE.PointLight(0xff8a3a, 2.0, 3, 1.5); glow.position.set(0.3, 1.25, -0.6); scene.add(glow);
      // hot gas in the stage: particles + a hot haze volume around the blades (only in front of the cut)
      const gas = gasStream({ count: 2600, z0: -1.4, z1: 1.1, thetaRange: [Math.PI - 0.45, Math.PI + 0.12], size: 20 });
      gas.userData.manualClock = true; scene.add(gas);
      const haze = fireVolume({ z0: -0.95, z1: 0.9, rA: [1.07, 1.43], rB: [1.07, 1.43], cutStart: Math.PI - 0.5, cutLen: 0.95, layers: 4, gain: 0.08 });
      haze.userData.mat.uniforms.uFront.value = 2; scene.add(haze);
      // cooling film on the hero blade (blade 0 at the top of the ring)
      const film = filmParticles(hs.blade, { perHole: 9 });
      const holder = new THREE.Group(); holder.position.set(0, DIM.R, 0); holder.add(film); hs.rotor.add(holder);
      film.material.uniforms.uTime = { value: 0 };
      // rotor slows to rest over J053 (angle = integral of a decaying speed), then the stillness
      const W0 = 1.6, TS = 2.2;
      const rotorAng = (t) => { const a0 = 0.05; if (t < TS) return a0 + W0 * (t - (t * t) / (2 * TS)); return a0 + W0 * TS / 2 + 0.004 * (t - TS); };
      const clock = (t) => { // gas flow clock: slows with the rotor, never stops (the storm keeps going), resumes in thermal
        const s0 = 1.0, s1 = 0.12; if (t < TS) return s0 * t - (s0 - s1) * (t * t) / (2 * TS);
        const c2 = s0 * TS - (s0 - s1) * TS / 2; const r = seg(t, 3.6, 5.0, ease.inOut2); return c2 + s1 * (t - TS) + 0.5 * Math.max(0, t - 3.6) * r; };
      st.run((t) => {
        hs.spin(-rotorAng(t));
        const th = seg(t, 3.62, 4.1, ease.inOut2);
        U.uThermal.value = th; U.uFilm.value = seg(t, 11.8, 13.5);
        hs.setHoleThermal(th * (0.15 + 0.4 * seg(t, 11.8, 13.5)));
        U.uHeat.value = 0.06 * (1 - th);
        gas.material.uniforms.uClock.value = clock(t);
        gas.material.uniforms.uAmt.value = lerp(0.55, 0.5, th);
        film.material.uniforms.uTime.value = clock(t) * 0.9 + 0.3 * t;
        film.material.uniforms.uAmt.value = th * (0.35 + 0.65 * seg(t, 11.8, 13.6));
        haze.userData.mat.uniforms.uAmt.value = 0.25 * (1 - th) + 0.1;
        glow.intensity = 2.0 * (1 - th); bg.material.uniforms.uHotBg.value = th;
        // camera: 3/4 view of the top blade from upstream; slow drift; J055 push into the leading-edge surface
        const drift = t / DURN, push = seg(t, 11.4, 17.6, ease.inOut2);
        const p0 = [-2.2 + 0.25 * drift, 1.42 - 0.04 * drift, -1.15 + 0.35 * drift];
        const p1 = [-0.46, 1.33, -0.34];
        const l0 = [0.02, 1.25, 0.0], l1 = [0.02, 1.27, -0.06];
        aim(camera, [lerp(p0[0], p1[0], push), lerp(p0[1], p1[1], push), lerp(p0[2], p1[2], push)],
          [lerp(l0[0], l1[0], push), lerp(l0[1], l1[1], push), lerp(l0[2], l1[2], push)], 0.02 * wob(t * 0.5));
        camera.fov = lerp(19, 28, push); camera.updateProjectionMatrix();
        st.setShimmer(0.5 + 0.4 * th, 0.5, 0.5, 0.45, 0.4);
        st.fx.grain.uniforms.get("uGrain").value = 0.045 + 0.03 * th;
      });
    </script>
  </body>
