<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>A7 · Recap triptych</title>
    <!-- Session A, The Jet Engine Paradox. Recap: three fast panels on the three phrases (+0.15 "Gas above the metal's melting
         point", +2.63 "A bus hanging from every blade", +4.77 "For thousands of hours"), each slides in with an impact; then
         they merge into the single glowing blade (live 3D). Panel media are cuts of this session's own renders (A5, A6, A8),
         made by make_media.sh into media/ (not committed).
         Shared model + render stack: jepA.js (master in ../_libA/); HDRI vendor/library/hdri/studio_small_09_1k.hdr ; -->
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/jsm/",
          "postprocessing": "./vendor/pp/postprocessing.js",
          "simplex-noise": "./vendor/noise/simplex-noise.js"
      } }
    </script>
    <link rel="stylesheet" href="jep.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      html, body { margin: 0; background: #0B0E14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0B0E14; font-family: Inter, Arial, sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .scrim { position: absolute; left: -260px; bottom: -260px; width: 1400px; height: 620px;
        background: radial-gradient(closest-side, rgba(5,6,10,0.65), rgba(5,6,10,0)); }
      .pw { position: absolute; top: 175px; width: 560px; height: 725px; overflow: hidden; background: #05070c;
        outline: 2px solid rgba(249,115,22,0.75); outline-offset: -2px; }
      .pw video { position: absolute; top: 0; height: 100%; width: auto; }
      .pw .fl { position: absolute; inset: 0; background: #fff3e0; opacity: 0; mix-blend-mode: screen; }
      #p1 { left: 80px; } #p2 { left: 680px; } #p3 { left: 1280px; }
      #v1 { left: -693px; } #v2 { left: -794px; } #v3 { left: -560px; }
      #dim { position: absolute; inset: 0; background: rgba(5,6,10,0.55); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="A7_recap" data-start="0" data-width="1920" data-height="1080" data-duration="6.64">
      <canvas id="gl"></canvas>
      <div id="dim"></div>
      <div class="pw" id="p1"><video id="v1" src="media/p1.mp4" data-start="0.15" data-duration="6.49" muted playsinline></video><div class="fl" id="f1"></div></div>
      <div class="pw" id="p2"><video id="v2" src="media/p2.mp4" data-start="2.55" data-duration="4.09" muted playsinline></video><div class="fl" id="f2"></div></div>
      <div class="pw" id="p3"><video id="v3" src="media/p3.mp4" data-start="4.7" data-duration="1.94" muted playsinline></video><div class="fl" id="f3"></div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      const slide = (p, f, at) => {
        tl.fromTo(p, { opacity: 0, x: -140, scale: 1.0 }, { opacity: 1, x: 0, duration: 0.28, ease: "power4.out" }, at);
        tl.fromTo(p, { scale: 1.06 }, { scale: 1.0, duration: 0.45, ease: "power2.out" }, at + 0.22);
        tl.fromTo(f, { opacity: 0.0 }, { opacity: 0.55, duration: 0.05 }, at + 0.2);
        tl.to(f, { opacity: 0, duration: 0.35, ease: "power2.out" }, at + 0.25);
        tl.to(p, { y: -8, duration: 0.08, yoyo: true, repeat: 1, ease: "power1.inOut" }, at + 0.22);
      };
      slide("#p1", "#f1", 0.15); slide("#p2", "#f2", 2.55); slide("#p3", "#f3", 4.7);
      // merge: all three collapse into the centre and dissolve into the glowing blade
      tl.to("#p1", { x: 600, scale: 0.55, opacity: 0, duration: 0.45, ease: "power3.in" }, 5.95);
      tl.to("#p3", { x: -600, scale: 0.55, opacity: 0, duration: 0.45, ease: "power3.in" }, 5.95);
      tl.to("#p2", { scale: 0.55, opacity: 0, duration: 0.45, ease: "power3.in" }, 6.0);
      tl.to("#dim", { opacity: 0, duration: 0.5, ease: "power2.out" }, 6.0);
      window.__timelines["A7_recap"] = tl;
    </script>
    <script type="module">
      import { THREE, createStage, lightRig, backdrop, makeBlade, hotMetal, holeDecals, embers, setEnv, U, seg, ease, lerp, wob, aim } from "./jepA.js";
      const st = createStage({ fov: 26, bloom: { intensity: 1.0, threshold: 1.1, smoothing: 0.35, radius: 0.8 } });
      const { scene, camera } = st;
      const bg = backdrop({ glowDir: [0.0, 0.0, -1], glow: 0.9 }); scene.add(bg);
      const L = lightRig(scene, { key: 0.6, rim: 5.5, fill: 0.15 });
      const blade = makeBlade();
      const mesh = new THREE.Mesh(blade.geometry, hotMetal({ roughness: 0.38 }));
      const pivot = new THREE.Group(); pivot.add(mesh, holeDecals(blade.holes)); scene.add(pivot);
      const em = embers({ count: 260, box: [2.2, 1.6, 1.6], center: [0, 0.1, 0], size: 18 }); scene.add(em);
      setEnv(scene, 0.35);
      st.run((t) => {
        const m = seg(t, 5.95, 6.5, ease.out);
        U.uHeat.value = 0.35 + 0.5 * m;
        pivot.rotation.y = -0.5 + 0.35 * t / 6.64 + 0.25 * m;
        const r = lerp(1.9, 1.45, m);
        aim(camera, [Math.sin(0.3) * r, 0.62, Math.cos(0.3) * r], [0, 0.09, 0], 0.02 * wob(t));
        st.setShimmer(0.8, 0.5, 0.6, 0.25, 0.3);
      });
    </script>
  </body>
</html>
