<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>A1 · Title: hero turbine blade</title>
    <!-- Session A, The Jet Engine Paradox. Title: macro of one single-crystal HP turbine blade glowing amber-hot in darkness,
         slow orbit, embers, heat shimmer. First 2.5 s clean (logo sting at assembly); from "Today, the story of" (+2.54 s) the
         title THE JET ENGINE PARADOX burns in (amber edge glow into Ceramic White) and holds to the end.
         Shared model + render stack: jepA.js (master in ../_libA/); HDRI vendor/library/hdri/studio_small_09_1k.hdr ; -->
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": {
          "three": "./vendor/three/three.module.js",
          "three/addons/": "./vendor/three/jsm/",
          "postprocessing": "./vendor/pp/postprocessing.js",
          "simplex-noise": "./vendor/noise/simplex-noise.js"
      } }
    </script>
    <link rel="stylesheet" href="jep.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      html, body { margin: 0; background: #0B0E14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0B0E14; font-family: Inter, Arial, sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .scrim { position: absolute; left: -260px; bottom: -260px; width: 1400px; height: 620px;
        background: radial-gradient(closest-side, rgba(5,6,10,0.65), rgba(5,6,10,0)); }
      #title { position: absolute; left: 112px; top: 360px; width: 1200px; }
      #title .rule { display: block; width: 120px; height: 5px; background: var(--amber); margin-bottom: 30px; box-shadow: 0 0 18px rgba(249,115,22,0.8); transform-origin: 0 50%; }
      .tw { position: relative; }
      .tw div { font: 800 112px/1.02 var(--font); letter-spacing: 0.015em; text-transform: uppercase; white-space: nowrap; }
      #tCool { color: var(--white); --m: 100%; -webkit-mask-image: linear-gradient(90deg, #000 45%, transparent 55%); mask-image: linear-gradient(90deg, #000 45%, transparent 55%);
        -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: var(--m) 0; mask-position: var(--m) 0; }
      #tHot { position: absolute; left: 0; top: 0; color: #FDBA74; text-shadow: 0 0 10px rgba(249,115,22,0.95), 0 0 34px rgba(249,115,22,0.7), 0 0 80px rgba(239,68,68,0.45);
        --m: 100%; -webkit-mask-image: linear-gradient(90deg, transparent 38%, #000 47%, #000 53%, transparent 62%); mask-image: linear-gradient(90deg, transparent 38%, #000 47%, #000 53%, transparent 62%);
        -webkit-mask-size: 300% 100%; mask-size: 300% 100%; -webkit-mask-position: var(--m) 0; mask-position: var(--m) 0; }
      #tEdge { position: absolute; left: 0; top: 0; color: transparent; -webkit-text-stroke: 1.5px rgba(253,186,116,0.9); text-shadow: 0 0 22px rgba(249,115,22,0.55); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="A1_title_blade" data-start="0" data-width="1920" data-height="1080" data-duration="13.76">
      <canvas id="gl"></canvas>
      <div class="scrim"></div>
      <div id="title"><span class="rule" id="rule"></span>
        <div class="tw"><div id="tCool">The jet engine<br />paradox</div><div id="tEdge">The jet engine<br />paradox</div><div id="tHot">The jet engine<br />paradox</div></div>
      </div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#rule", { scaleX: 0, opacity: 0 }, { scaleX: 1, opacity: 1, duration: 0.7, ease: "power3.out" }, 2.5);
      // burn-in: a white-hot band sweeps left to right; behind it the letters cool from amber to ceramic white
      tl.fromTo("#tHot", { "--m": "100%" }, { "--m": "-20%", duration: 2.2, ease: "power1.inOut" }, 2.6);
      tl.fromTo("#tCool", { "--m": "100%" }, { "--m": "0%", duration: 2.4, ease: "power1.inOut" }, 2.75);
      tl.fromTo("#tEdge", { opacity: 0 }, { opacity: 0.9, duration: 0.6 }, 3.2);
      tl.to("#tEdge", { opacity: 0.25, duration: 2.5, ease: "sine.inOut" }, 5.2);
      tl.to("#tEdge", { opacity: 0.45, duration: 3.0, ease: "sine.inOut", yoyo: true, repeat: 1 }, 7.7);
      tl.fromTo("#title", { x: 0 }, { x: 18, duration: 11.2, ease: "none" }, 2.5);
      window.__timelines["A1_title_blade"] = tl;
    </script>
    <script type="module">
      import { THREE, createStage, lightRig, backdrop, makeBlade, hotMetal, holeDecals, embers, setEnv, U, seg, ease, lerp, wob, aim } from "./jepA.js";
      const st = createStage({ fov: 26, bloom: { intensity: 1.0, threshold: 1.1, smoothing: 0.35, radius: 0.8 } });
      const { scene, camera } = st;
      const bg = backdrop({ glowDir: [0.4, -0.1, -1], glow: 0.9 }); scene.add(bg);
      const L = lightRig(scene, { key: 0.6, rim: 5.5, fill: 0.15 });
      const blade = makeBlade();
      const mat = hotMetal({ roughness: 0.38 });
      const mesh = new THREE.Mesh(blade.geometry, mat);
      const holes = holeDecals(blade.holes);
      const pivot = new THREE.Group(); pivot.add(mesh, holes); scene.add(pivot);
      const em = embers({ count: 320, box: [2.2, 1.6, 1.6], center: [0.1, 0.15, 0], size: 18 }); scene.add(em);
      const glowL = new THREE.PointLight(0xff7a2a, 1.2, 2.5, 1.6); glowL.position.set(0.3, 0.1, -0.5); scene.add(glowL);
      setEnv(scene, 0.35);
      st.run((t) => {
        const k = t / 13.76;
        U.uHeat.value = 0.6 + 0.06 * Math.sin(t * 0.9) + 0.2 * seg(t, 0, 4);
        pivot.rotation.y = -0.9 + 1.25 * ease.inOut2(k);
        pivot.rotation.z = 0.06 + 0.02 * wob(t * 0.6);
        const r = lerp(1.75, 1.45, ease.inOut2(k)), a = 0.25 + 0.18 * k;
        aim(camera, [Math.sin(a) * r, 0.75 - 0.12 * k, Math.cos(a) * r], [-0.30 + 0.04 * k, 0.14, 0], -0.05 + 0.03 * wob(t * 0.3, 2));
        em.material.uniforms.uAmt.value = 0.9;
        st.setShimmer(0.9, 0.68, 0.62, 0.22, 0.32);
      });
    </script>
  </body>
</html>
