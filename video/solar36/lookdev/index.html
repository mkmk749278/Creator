<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Film 36 lookdev v2: daylight lane + blueprint X-ray</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 800; src: url("vendor/fonts/inter-latin-ext-600-normal.woff2") format("woff2");
    unicode-range: U+2190-21FF, U+2713, U+2248, U+00B7; }
  :root { --bp-bg: #0d1117; --bp-panel: #161b22; --bp-grid: #30363d; --bp-signal: #58a6ff; --bp-pressure: #d29922;
    --bp-verified: #3fb950; --bp-fail: #f85149; --bp-readout: #e6edf3; --bp-label: #C9D1D9; }
  html, body { margin: 0; background: var(--bp-bg); }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, Arial, sans-serif; }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .w-plate { font: 800 15px Inter, Arial, sans-serif; fill: #F7F9F9; letter-spacing: 0.04em; }
  .w-db { font: 800 17px Inter, Arial, sans-serif; fill: #1C2833; letter-spacing: 0.04em; }
  .w-lcd { font: 800 14px Inter, Arial, sans-serif; fill: #7DFFB0; }
  .w-danger { font: 800 11px Inter, Arial, sans-serif; fill: #C0392B; }
  .x-tag { font: 800 28px Inter, Arial, sans-serif; fill: var(--bp-label); letter-spacing: 0.10em; }
  .x-tag.green { fill: var(--bp-verified); } .x-tag.cyan { fill: var(--bp-signal); }
  #grain { position: absolute; inset: 0; opacity: 0.08; mix-blend-mode: multiply; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 60%, rgba(30,15,0,0.28) 100%); }
  #hud { position: absolute; left: 56px; top: 48px; padding: 16px 24px; min-width: 380px; background: rgba(22,27,34,0.86);
    border: 1px solid var(--bp-grid); border-radius: 12px; color: var(--bp-readout); font: 800 26px Inter, Arial, sans-serif; letter-spacing: 0.06em; opacity: 0.78; }
  #hud .row { display: flex; justify-content: space-between; gap: 30px; line-height: 46px; font-variant-numeric: tabular-nums; border-radius: 6px; padding: 0 6px; }
  #hud .k { color: #b6bec8; font-weight: 600; }
  #hud .v.cyan { color: var(--bp-signal); } #hud .v.green { color: var(--bp-verified); } #hud .v.amber { color: var(--bp-pressure); }
  #title { position: absolute; left: 0; right: 0; top: 64px; text-align: center; opacity: 0; }
  #title span { display: inline-block; padding: 10px 26px; background: rgba(13,17,23,0.80); color: var(--bp-readout); border-radius: 10px;
    font: 800 40px Inter, Arial, sans-serif; letter-spacing: 0.12em; }
  #cap { position: absolute; left: 0; right: 0; bottom: 34px; text-align: center; }
  #cap span { display: inline-block; padding: 10px 26px; background: rgba(13,17,23,0.78); color: #fff; border-radius: 10px;
    font: 600 42px Inter, Arial, sans-serif; }
  #bug { position: absolute; right: 56px; top: 48px; width: 124px; height: 124px; border-radius: 62px; background: rgba(13,17,23,0.82);
    border: 2px solid rgba(230,237,243,0.35); color: var(--bp-readout); font: 800 18px Inter, Arial, sans-serif; display: flex;
    align-items: center; justify-content: center; text-align: center; letter-spacing: 0.06em; }
  #tag { position: absolute; right: 56px; top: 184px; font: 800 18px Inter, Arial, sans-serif; letter-spacing: 0.12em; color: var(--bp-label);
    background: rgba(13,17,23,0.7); padding: 6px 12px; border-radius: 6px; opacity: 0; }
</style>
</head>
<body>
<div id="root" data-composition-id="solar36_lookdev" data-start="0" data-width="1920" data-height="1080" data-duration="7">
  <svg id="stage" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
  <svg id="grain" viewBox="0 0 1920 1080" data-layout-allow-occlusion>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="36" /><feColorMatrix type="saturate" values="0" /></filter>
    <rect width="1920" height="1080" filter="url(#n)" />
  </svg>
  <div id="vig" data-layout-allow-occlusion></div>
  <div id="hud">
    <div class="row" id="rGrid"><span class="k">GRID</span><span class="v cyan">230 V · 50.0 Hz</span></div>
    <div class="row" id="rBox"><span class="k">SOLAR BOX</span><span class="v green" id="hBox">IN STEP ✓</span></div>
  </div>
  <div id="title"><span>DRUMMER · DANCER</span></div>
  <div id="cap"><span id="capA">Think of the grid as a drummer… and the solar box as a dancer.</span></div>
  <div id="bug">BE<br/>PRACTICAL</div>
  <div id="tag">ILLUSTRATION · SLOWED DOWN</div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="world.js"></script>
<script>
  const svg = document.getElementById("stage"), E = W36.el, C = W36.C;
  const L = W36.lane(svg), X = W36.xray(svg);
  const tl = gsap.timeline({ paused: true });
  const BEAT = 0.6, T_PUSH = 2.6, T_X = 3.3;

  // ---------- world (0 → 2.6 s): one hero motion per beat ----------
  tl.fromTo("#world", { svgOrigin: "924 654", scale: 1.0, x: 0, y: 0 }, { scale: 1.04, x: -26, y: 0, duration: T_PUSH, ease: "sine.inOut" }, 0);
  tl.fromTo("#fg", { x: 0 }, { x: -90, duration: T_PUSH, ease: "sine.inOut" }, 0);
  tl.fromTo("#glint", { x: 0 }, { x: 520, duration: 1.4, ease: "power1.inOut" }, 0.3);
  document.querySelectorAll(".cloth").forEach((c, i) =>
    tl.fromTo(c, { rotation: -3, transformOrigin: "50% 0%" }, { rotation: 3, duration: 0.8 + i * 0.12, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0));
  L.dc.setAttribute("stroke-dasharray", "20 12");
  tl.fromTo(L.dc, { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -260 }, duration: T_PUSH, ease: "none" }, 0);
  tl.set("#dhol", { scaleX: 1, scaleY: 1, svgOrigin: "0 0" }, 0).set("#badge", { y: 0 }, 0).set("#dholShock", { opacity: 0, attr: { r: 60 } }, 0).set("#meterLed", { opacity: 0.25 }, 0);
  const ringPath = L.ring, len = ringPath.getTotalLength();
  for (let b = 0; b < 5; b++) {
    const t0 = b * BEAT;
    tl.to("#dhol", { scaleX: 1.15, scaleY: 0.85, duration: 0.06, ease: "power2.out" }, t0)
      .to("#dhol", { scaleX: 0.96, scaleY: 1.05, duration: 0.10, ease: "sine.out" }, t0 + 0.06)
      .to("#dhol", { scaleX: 1, scaleY: 1, duration: 0.14, ease: "sine.inOut" }, t0 + 0.16);
    tl.fromTo("#dholShock", { opacity: 0.95, attr: { r: 60 } }, { opacity: 0, attr: { r: 130 }, duration: 0.42, ease: "power2.out", immediateRender: false }, t0);
    const ring = E("circle", { r: 27, fill: "rgba(88,166,255,0.25)", stroke: C.cyan, "stroke-width": 6, opacity: 0 }, L.world);
    const p = { u: 0 }, TR = 0.7;
    tl.fromTo(p, { u: 0 }, { u: 1, duration: TR, ease: "power1.in", immediateRender: false, onUpdate: () => {
      const pt = ringPath.getPointAtLength(p.u * len);
      ring.setAttribute("cx", pt.x); ring.setAttribute("cy", pt.y);
      ring.setAttribute("opacity", p.u <= 0 || p.u >= 1 ? 0 : Math.min(1, 8 * p.u, 4 * (1 - p.u) + 0.15));
      ring.setAttribute("r", 30 - 10 * p.u);
    } }, t0);
    // the dancer bobs when the beat arrives; the net meter LED pulses
    tl.to("#badge", { y: -9, duration: 0.09, ease: "power2.out" }, t0 + TR).to("#badge", { y: 0, duration: 0.2, ease: "sine.in" }, t0 + TR + 0.09);
    tl.to("#meterLed", { opacity: 1, duration: 0.05 }, t0 + TR - 0.05).to("#meterLed", { opacity: 0.25, duration: 0.25 }, t0 + TR);
  }
  tl.fromTo("#title", { opacity: 0, y: -10 }, { opacity: 1, y: 0, duration: 0.3 }, 0.2).to("#title", { opacity: 0, duration: 0.2 }, 2.2);

  // ---------- match-cut push into the box (2.6 → 3.3 s) ----------
  tl.to("#world", { scale: 5.5, x: 36, y: -114, svgOrigin: "924 654", duration: 0.7, ease: "power2.inOut" }, T_PUSH);
  tl.to("#fg", { x: -900, y: 260, opacity: 0, duration: 0.5, ease: "power2.in" }, T_PUSH);
    tl.fromTo("#xInner", { opacity: 0 }, { opacity: 1, duration: 0.4 }, T_X + 0.1);
  tl.fromTo("#xWipeC", { attr: { r: 0 } }, { attr: { r: 1150 }, duration: 0.45, ease: "power2.in" }, T_X - 0.15);
  tl.to("#tag", { opacity: 1, duration: 0.3 }, T_X + 0.2);
  tl.set("#world", { visibility: "hidden" }, T_X + 0.35).set("#fg", { visibility: "hidden" }, T_X + 0.35);
  tl.set("#capA", { textContent: "Inside, it listens to the grid — and follows every beat." }, T_X + 0.1);
  tl.set("#hBox", { textContent: "LISTENING", className: "v cyan" }, T_X + 0.2);
  tl.fromTo("#rBox", { backgroundColor: "rgba(88,166,255,0.16)" }, { backgroundColor: "rgba(88,166,255,0)", duration: 0.6, immediateRender: false }, T_X + 0.2);
  
  // ---------- X-ray (3.3 → 7 s) ----------
  tl.fromTo("#xcam", { scale: 1.04, svgOrigin: "960 540" }, { scale: 1.0, duration: 3.7, ease: "sine.out" }, T_X);
  const dots = document.querySelectorAll(".dcdot"), sws = document.querySelectorAll(".sw");
  const sense = document.getElementById("sense"), acOut = document.getElementById("acOut");
  const tGrid = document.getElementById("tGrid"), tBox = document.getElementById("tBox");
  const LOCK0 = T_X + 1.3, LOCK1 = LOCK0 + 0.8;
  const pr = { t: 0 };
  tl.fromTo(pr, { t: T_X }, { t: 7, duration: 7 - T_X, ease: "none", onUpdate: () => {
    const T = pr.t, ph = -2 * Math.PI * T / BEAT;
    dots.forEach((d, i) => d.setAttribute("cx", 320 + ((i * 44 + T * 150) % 440)));
    sws.forEach((s, k) => s.setAttribute("fill", (Math.floor(T / (BEAT / 4)) + (k === 0 || k === 3 ? 0 : 1)) % 2 ? "rgba(88,166,255,0.45)" : "none"));
    acOut.setAttribute("d", W36.sinePath(1180, 1580, 620, 46, 1.6, ph, 80));
    document.getElementById("pupil").setAttribute("cx", (980 + 8 * Math.sin(-ph)).toFixed(1));
    sense.setAttribute("stroke-dashoffset", (-T * 60).toFixed(1));
    const off = T < LOCK0 ? Math.PI / 6 : T > LOCK1 ? 0 : (Math.PI / 6) * (1 - (T - LOCK0) / (LOCK1 - LOCK0));
    tGrid.setAttribute("d", W36.sinePath(1350, 1850, 370, 60, 3, ph));
    tBox.setAttribute("d", W36.sinePath(1350, 1850, 370, 60, 3, ph + off));
  } }, T_X);
  tl.fromTo("#inStep", { opacity: 0, scale: 1.3, svgOrigin: "1780 262" }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2)" }, LOCK1);
  tl.set("#hBox", { textContent: "IN STEP ✓", className: "v green" }, LOCK1);
  tl.fromTo("#rBox", { backgroundColor: "rgba(63,185,80,0.16)" }, { backgroundColor: "rgba(63,185,80,0)", duration: 0.6, immediateRender: false }, LOCK1);

  window.__timelines = window.__timelines || {};
  window.__timelines["solar36_lookdev"] = tl;
</script>
</body>
</html>
