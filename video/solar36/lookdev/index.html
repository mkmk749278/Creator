<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>Film 36 lookdev: daylight lane + blueprint X-ray</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
  html, body { margin: 0; background: #0d1117; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; font-family: Inter, Arial, sans-serif; }
  #stage { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .w-tag { font: 800 18px Inter, Arial, sans-serif; fill: #3B342C; letter-spacing: 0.08em; }
  .w-mini { font: 800 16px Inter, Arial, sans-serif; fill: #44525F; }
  .w-lcd { font: 800 13px Inter, Arial, sans-serif; fill: #7DFFB0; }
  .x-tag { font: 800 22px Inter, Arial, sans-serif; fill: #8b949e; letter-spacing: 0.14em; }
  .x-tag.green { fill: #3fb950; }
  #grain { position: absolute; inset: 0; opacity: 0.10; mix-blend-mode: multiply; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 58%, rgba(40,20,0,0.30) 100%); }
  #hud { position: absolute; left: 56px; top: 48px; padding: 18px 24px; min-width: 360px; background: rgba(22,27,34,0.85);
    border: 1px solid #30363d; border-radius: 10px; color: #e6edf3; font: 800 22px Inter, Arial, sans-serif; letter-spacing: 0.08em; }
  #hud .row { display: flex; justify-content: space-between; gap: 28px; line-height: 40px; font-variant-numeric: tabular-nums; }
  #hud .k { color: #a9b2bc; font-weight: 600; }
  #hud .v.cyan { color: #58a6ff; } #hud .v.green { color: #3fb950; } #hud .v.amber { color: #d29922; }
  #hud .chip { margin-top: 6px; font: 600 14px Inter, Arial, sans-serif; color: #a9b2bc; letter-spacing: 0.16em; }
  #label { position: absolute; left: 96px; bottom: 150px; padding: 10px 20px; background: rgba(13,17,23,0.78); color: #e6edf3;
    font: 800 34px Inter, Arial, sans-serif; letter-spacing: 0.10em; border-left: 6px solid #58a6ff; opacity: 0; }
  #cap { position: absolute; left: 0; right: 0; bottom: 40px; text-align: center; }
  #cap span { display: inline-block; padding: 8px 22px; background: rgba(13,17,23,0.72); color: #fff; border-radius: 8px;
    font: 600 34px Inter, Arial, sans-serif; }
  #bug { position: absolute; right: 56px; top: 48px; width: 120px; height: 120px; border-radius: 60px; background: rgba(13,17,23,0.5);
    color: #e6edf3; font: 800 18px Inter, Arial, sans-serif; display: flex; align-items: center; justify-content: center; text-align: center; letter-spacing: 0.06em; }
</style>
</head>
<body>
<div id="root" data-composition-id="solar36_lookdev" data-start="0" data-width="1920" data-height="1080" data-duration="7">
  <svg id="stage" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
  <svg id="grain" viewBox="0 0 1920 1080" data-layout-allow-occlusion>
    <filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="36" /><feColorMatrix type="saturate" values="0" /></filter>
    <rect width="1920" height="1080" filter="url(#n)" />
  </svg>
  <div id="vig" data-layout-allow-occlusion></div>
  <div id="hud">
    <div class="row"><span class="k">GRID</span><span class="v cyan" id="hGrid">230 V · 50.0 Hz</span></div>
    <div class="row"><span class="k">SOLAR BOX</span><span class="v green" id="hBox">IN STEP ✓</span></div>
    <div class="row"><span class="k">EXPORT</span><span class="v amber" id="hExp">+1.2 kW</span></div>
    <div class="chip">ILLUSTRATIVE</div>
  </div>
  <div id="label">DRUMMER · DANCER</div>
  <div id="cap"><span id="capT">Think of the grid as a drummer… and the solar box as a dancer.</span></div>
  <div id="bug">BE<br/>PRACTICAL</div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="world.js"></script>
<script>
  const D = 7, svg = document.getElementById("stage"), E = W36.el, C = W36.C;
  const L = W36.lane(svg), X = W36.xray(svg);
  const tl = gsap.timeline({ paused: true });
  const BPM_T = 0.6; // one drum beat (= one wave crest, slowed down) every 0.6 s

  // --- daylight lane (0 → 3.4 s) ---
  tl.fromTo("#world", { svgOrigin: "850 685", scale: 1.0, x: 0, y: 0 }, { scale: 1.06, x: -20, y: 0, duration: 3.4, ease: "sine.inOut" }, 0);
  tl.fromTo("#sunGlow", { scale: 0.95, transformOrigin: "50% 50%" }, { scale: 1.08, duration: 3.4, ease: "sine.inOut" }, 0);
  document.querySelectorAll(".cloth").forEach((c, i) =>
    tl.fromTo(c, { rotation: -4, transformOrigin: "50% 0%" }, { rotation: 4, duration: 0.9 + i * 0.13, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0));
  // PV cable: amber dashes flowing one way (DC)
  L.cable.setAttribute("stroke-dasharray", "18 14");
  tl.fromTo(L.cable, { attr: { "stroke-dashoffset": 0 } }, { attr: { "stroke-dashoffset": -320 }, duration: 3.4, ease: "none" }, 0);
  // dhol beats: scale pulse on each beat, a cyan ring leaves the transformer and runs down the wire to the house
  const len = L.main.getTotalLength();
  tl.set("#dhol", { scale: 1.0, transformOrigin: "50% 50%" }, 0).set("#dholGlow", { opacity: 0.25 }, 0).set("#badge", { rotation: 0, svgOrigin: "860 705" }, 0);
  for (let b = 0; b < 6; b++) {
    const t0 = 0.2 + b * BPM_T;
    tl.fromTo("#dhol", { scale: 1.12, transformOrigin: "50% 50%" }, { scale: 1.0, duration: 0.3, ease: "power2.out", immediateRender: false }, t0);
    tl.fromTo("#dholGlow", { opacity: 0.9 }, { opacity: 0.25, duration: 0.4, immediateRender: false }, t0);
    const ring = E("circle", { r: 14, fill: "none", stroke: C.cyan, "stroke-width": 5, opacity: 0 }, L.world);
    const p = { u: 0 };
    tl.fromTo(p, { u: 0 }, { u: 1, duration: 1.4, ease: "none", immediateRender: false, onUpdate: () => {
      const pt = L.main.getPointAtLength(p.u * len);
      ring.setAttribute("cx", pt.x); ring.setAttribute("cy", pt.y);
      ring.setAttribute("opacity", p.u <= 0 || p.u >= 1 ? 0 : Math.min(1, 6 * p.u, 6 * (1 - p.u)));
      ring.setAttribute("r", 12 + 10 * Math.sin(Math.PI * p.u));
    } }, t0);
    // the dancer sways on the beat
    tl.fromTo("#badge", { rotation: b % 2 ? 8 : -8, svgOrigin: "860 705" }, { rotation: 0, duration: BPM_T - 0.05, ease: "sine.out", immediateRender: false }, t0 + 0.1);
  }
  tl.to("#label", { opacity: 1, duration: 0.3 }, 0.4).to("#label", { opacity: 0, duration: 0.3 }, 3.0);

  // --- push into the solar box (3.4 → 4.2 s) ---
  tl.to("#world", { scale: 7, x: 110, y: -145, svgOrigin: "850 685", duration: 0.8, ease: "power3.in" }, 3.4);
  tl.to("#xray", { opacity: 1, duration: 0.35, ease: "none" }, 3.9);
  tl.set("#capT", { textContent: "The solar box turns panel power into wall-socket power." }, 4.0);
  tl.set("#hBox", { textContent: "WATCHING" }, 4.0);

  // --- X-ray (4.2 → 7 s): DC dots one way, sine out, scope traces locked ---
  tl.fromTo("#xcam", { scale: 1.06, transformOrigin: "50% 50%" }, { scale: 1.0, duration: 2.8, ease: "sine.out" }, 4.2);
  const dc = document.querySelectorAll(".dcdot"), pr = { t: 0 };
  tl.fromTo(pr, { t: 0 }, { t: 1, duration: 3.0, ease: "none", onUpdate: () => {
    const T = pr.t * 3.0;
    dc.forEach((d, i) => d.setAttribute("cx", 120 + ((i * 48 + T * 160) % 576)));
    X.sine.setAttribute("d", W36.sinePath(940, 1180, 480, 70, 1.5, -T * 2 * Math.PI / BPM_T));
    X.tGrid.setAttribute("d", W36.sinePath(450, 1470, 870, 55, 4, -T * 2 * Math.PI / BPM_T));
    X.tBox.setAttribute("d", W36.sinePath(450, 1470, 870, 55, 4, -T * 2 * Math.PI / BPM_T));
    document.querySelectorAll(".sw").forEach((s, k) => s.setAttribute("fill", (Math.floor(T / (BPM_T / 2)) + k) % 2 ? "rgba(88,166,255,0.35)" : "none"));
  } }, 4.0);
  window.__timelines = window.__timelines || {};
  window.__timelines["solar36_lookdev"] = tl;
</script>
</body>
</html>
