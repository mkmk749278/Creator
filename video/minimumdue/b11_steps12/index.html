<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Whiteboard: marker handwriting scene</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/wb/wb-fonts.js"></script>
    <script src="vendor/wb/wb.js"></script>
    <script src="params.js"></script>
    <link rel="stylesheet" href="vendor/wb/wb.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 700; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body { background: #111; }
      #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #262c35; }
      #grain { position: absolute; inset: -40px; width: 2000px; height: 1160px; opacity: .06; mix-blend-mode: multiply; pointer-events: none; }
      .vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 58%, rgba(0,0,0,.38) 100%); pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="whiteboard" data-start="0" data-width="1920" data-height="1080" data-duration="20.68">
      <div id="stage"></div>
      <div class="wb-tag" id="tag"></div>
      <canvas id="grain" width="500" height="290"></canvas>
      <div class="vig"></div>
    </div>
    <script>
      const S = window.SCENE, D = S.duration, tl = gsap.timeline({ paused: true });
      document.getElementById("root").dataset.duration = D;
      const tag = document.getElementById("tag");
      if (S.tag) tag.textContent = S.tag; else tag.remove();
      // film grain: seeded, shifted from time only
      (() => { const c = document.getElementById("grain"), x = c.getContext("2d"); let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
        const im = x.createImageData(500, 290); for (let i = 0; i < im.data.length; i += 4) { const v = 90 + r() * 165; im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
        x.putImageData(im, 0, 0); })();
      const clock = { t: 0 };
      tl.to(clock, { t: D, duration: D, ease: "none" }, 0);   // the timeline spans the whole scene
      // camera keys
      const stage = document.getElementById("stage"), cam = S.camera || [{ at: 0, scale: 1, x: 0, y: 0 }];
      gsap.set(stage, { scale: cam[0].scale, x: cam[0].x, y: cam[0].y });
      for (let i = 1; i < cam.length; i++) tl.to(stage, { scale: cam[i].scale, x: cam[i].x, y: cam[i].y, duration: cam[i].at - cam[i - 1].at, ease: "sine.inOut" }, cam[i - 1].at);
      // board and steps
      const b = WB.board(stage, { seed: S.seed || 1 });
      for (const st of S.steps) {
        const op = Object.assign({ font: S.font }, st);
        if (st.write != null) b.write(st.write, op);
        else if (st.underline === "last") b.underlineLast(op);
        else if (st.circle === "last") b.circleLast(op);
        else if (st.strike === "last") b.strikeLast(op);
        else if (st.box === "last") b.boxLast(op);
        else if (st.underline) b.underline(...st.underline, op);
        else if (st.strike) b.strike(...st.strike, op);
        else if (st.circle) b.circle(...st.circle, op);
        else if (st.arrow) b.arrow(...st.arrow, op);
        else if (st.box) b.box(...st.box, op);
        else if (st.tick) b.tick(...st.tick, op);
        else if (st.cross) b.cross(...st.cross, op);
        else if (st.bar) b.bar(...st.bar, op);
        else if (st.line) b.line(st.line, op);
        else if (st.erase) b.erase(op);
      }
      const grain = document.getElementById("grain");
      b.attach(tl);
      const prev = tl.eventCallback("onUpdate");
      tl.eventCallback("onUpdate", function () { prev.apply(this, arguments); const f = Math.floor(tl.time() * 24) % 7; grain.style.transform = `translate(${(f * 13) % 40 - 20}px, ${(f * 7) % 30 - 15}px) scale(4)`; });
      window.__timelines = window.__timelines || {};
      window.__timelines["whiteboard"] = tl;
    </script>
  </body>
</html>
