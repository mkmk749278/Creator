<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>R1 · The hangar walk-around</title>
    <!-- Room 1 of "The Blade That Should Melt" (screenplay v2): one continuous first-person camera. Hangar door rises, walk in,
         past the line of jets, under-the-wing hero, stop dead on "not one", walk to the tail, push into the empty exhaust tunnel,
         whip out. 0:00-0:41.3 of the voice-over (final/align). Generic procedural jet (illustration); procedural hangar. -->
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/jsm/", "postprocessing": "./vendor/pp/postprocessing.js", "simplex-noise": "./vendor/noise/simplex-noise.js" } }
    </script>
    <link rel="stylesheet" href="jep.css" />
    <style>
      html, body { margin: 0; background: #0B0E14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #05070b; font-family: Inter, Arial, sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .lab { opacity: 0; }
      #bar { position: absolute; left: 96px; bottom: 120px; opacity: 0; padding: 18px 22px 16px; background: rgba(11,14,20,0.72); border-left: 4px solid var(--amber); }
      #bar .t { font: 800 40px/1.1 var(--font); letter-spacing: 0.04em; color: var(--white); text-transform: uppercase; margin-bottom: 12px; }
      #bar .t b { color: var(--amber); }
      #grid { display: grid; grid-template-columns: repeat(33, 16px); gap: 4px; }
      #grid i { display: block; width: 16px; height: 16px; background: rgba(148,163,184,0.25); }
      #grid i.on { background: var(--amber); }
      .red { color: var(--red); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="R1_hangar" data-start="0" data-width="1920" data-height="1080" data-duration="41.3">
      <canvas id="gl"></canvas>
      <div class="jep-label lab" id="l1">Jets built<small>about thirty</small></div>
      <div class="jep-label lab" id="l2">Delivered to the Air Force: <span class="red">0</span></div>
      <div id="bar"><div class="t">Engines sent <b>14</b> of 99</div><div id="grid"></div></div>
    </div>
    <script>
      const g = document.getElementById("grid"); for (let i = 0; i < 99; i++) { const e = document.createElement("i"); if (i < 14) e.className = "on"; g.appendChild(e); }
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#l1", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, 8.2).to("#l1", { opacity: 0, duration: 0.5 }, 19.4);
      tl.fromTo("#l2", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 21.0).to("#l2", { opacity: 0, duration: 0.5 }, 25.0);
      tl.fromTo("#bar", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 36.2);
      tl.fromTo("#grid i.on", { opacity: 0.1 }, { opacity: 1, duration: 0.25, stagger: 0.05 }, 36.9);
      window.__timelines = window.__timelines || {}; window.__timelines["R1_hangar"] = tl;
    </script>
    <script type="module">
      import { THREE, createStage, setEnv, seg, ease, lerp, clamp, mulberry32 } from "./jebA.js";
      import { makeJet, floorTexture, textDecal, JET } from "./jebTejas.js";
      await document.fonts.load("800 150px Inter");
      const st = createStage({ fov: 50, near: 0.05, far: 400, bloom: { intensity: 0.85, threshold: 1.05, smoothing: 0.25, radius: 0.8 }, vignette: 0.5, exposure: 1.0 });
      const { scene, camera } = st;
      scene.background = new THREE.Color(0x03050a); scene.fog = new THREE.FogExp2(0x0a111a, 0.0105);
      setEnv(scene, 0.16);

      // --- hangar shell -----------------------------------------------------------------------------------------
      const hang = new THREE.Group(); scene.add(hang);
      const ft = floorTexture(); ft.repeat.set(2.2, 3.6);
      const floor = new THREE.Mesh(new THREE.PlaneGeometry(66, 110), new THREE.MeshPhysicalMaterial({ map: ft, roughness: 0.42, metalness: 0.0, color: 0x9a9fa6, clearcoat: 0.18, clearcoatRoughness: 0.35, envMapIntensity: 0.3 }));
      floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, 50); hang.add(floor);
      const wallMat = new THREE.MeshStandardMaterial({ color: 0x232a34, roughness: 0.75, metalness: 0.35 });
      const wall = (w, h, x, y, z, ry = 0) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, 0.4), wallMat); m.position.set(x, y, z); m.rotation.y = ry; hang.add(m); return m; };
      wall(110, 17, -33, 8.5, 50, Math.PI / 2); wall(110, 17, 33, 8.5, 50, Math.PI / 2); wall(66, 17, 0, 8.5, 105, 0);
      // door frame + door (rises)
      const doorMat = new THREE.MeshStandardMaterial({ color: 0x1a2028, roughness: 0.6, metalness: 0.5 });
      const door = new THREE.Mesh(new THREE.BoxGeometry(66, 16.2, 0.5), doorMat); door.position.set(0, 8.1, -0.1); hang.add(door);
      const lintel = new THREE.Mesh(new THREE.BoxGeometry(66, 2.2, 0.8), wallMat); lintel.position.set(0, 16.0, 0); hang.add(lintel);
      for (let i = 0; i < 24; i++) { const rib = new THREE.Mesh(new THREE.BoxGeometry(66, 0.12, 0.62), doorMat); rib.position.set(0, 0.6 + i * 0.66, -0.25); door.add(rib); rib.position.y -= 8.1; rib.position.z = 0.05; }
      // roof, trusses, light strips
      const roof = new THREE.Mesh(new THREE.PlaneGeometry(66, 110), new THREE.MeshStandardMaterial({ color: 0x10141a, roughness: 0.9 })); roof.rotation.x = Math.PI / 2; roof.position.set(0, 17.3, 50); hang.add(roof);
      const trussMat = new THREE.MeshStandardMaterial({ color: 0x2c333d, roughness: 0.55, metalness: 0.6 });
      for (let z = 4; z < 104; z += 7) { const b = new THREE.Mesh(new THREE.BoxGeometry(66, 0.55, 0.4), trussMat); b.position.set(0, 16.4, z); hang.add(b); const b2 = new THREE.Mesh(new THREE.BoxGeometry(66, 0.3, 0.3), trussMat); b2.position.set(0, 14.9, z); hang.add(b2);
        for (let x = -30; x <= 30; x += 6) { const d = new THREE.Mesh(new THREE.BoxGeometry(0.18, 1.7, 0.18), trussMat); d.position.set(x, 15.65, z); hang.add(d); } }
      const strip = new THREE.MeshBasicMaterial({ color: new THREE.Color(0xdbe8ff).multiplyScalar(2.3) });
      for (const x of [-22, -6, 10, 24]) for (let z = 8; z < 100; z += 10) { const m = new THREE.Mesh(new THREE.BoxGeometry(0.35, 0.14, 5.2), strip); m.position.set(x, 14.6, z); hang.add(m); }
      const win = new THREE.MeshBasicMaterial({ color: new THREE.Color(0x7fa4d6).multiplyScalar(1.1) });
      for (const sx of [-1, 1]) for (let z = 6; z < 100; z += 12) { const m = new THREE.Mesh(new THREE.PlaneGeometry(8, 2.2), win); m.position.set(sx * 32.7, 12.6, z); m.rotation.y = -sx * Math.PI / 2; hang.add(m); }
      // safety lines
      const yel = new THREE.MeshBasicMaterial({ color: 0x9a7f1c });
      for (const x of [-1.0, 10.0]) { const m = new THREE.Mesh(new THREE.PlaneGeometry(0.16, 96), yel); m.rotation.x = -Math.PI / 2; m.position.set(x, 0.012, 52); hang.add(m); }
      // floor date stencil (in-world, read as the camera walks in)
      const dec = new THREE.Mesh(new THREE.PlaneGeometry(8.0, 1.2), new THREE.MeshBasicMaterial({ map: textDecal("OCTOBER 2026", { color: "#e9eef5" }), transparent: true, opacity: 0.8, depthWrite: false }));
      dec.rotation.x = -Math.PI / 2; dec.rotation.z = Math.PI; dec.position.set(4.5, 0.02, 7.0); hang.add(dec);
      // outside: ground + overcast sky
      const out = new THREE.Mesh(new THREE.PlaneGeometry(200, 120), new THREE.MeshStandardMaterial({ color: 0x59606a, roughness: 0.9 })); out.rotation.x = -Math.PI / 2; out.position.set(0, -0.02, -60); scene.add(out);
      const sky = new THREE.Mesh(new THREE.PlaneGeometry(400, 120), new THREE.MeshBasicMaterial({ color: new THREE.Color(0xa8bfdc).multiplyScalar(1.3), fog: false })); sky.position.set(0, 40, -110); scene.add(sky);

      // --- the fleet: ~30 generic jets, nose to the door -----------------------------------------------------------
      const hero = makeJet({ detail: 1, seed: 3 });
      const fleet = new THREE.Group(); scene.add(fleet);
      const heroPos = new THREE.Vector3(-6, 0, 20);
      hero.position.copy(heroPos); hero.rotation.y = Math.PI; fleet.add(hero);
      const rnd = mulberry32(77); const cols = [-26, -15.5, 15.5, 25.5], rows = [20, 36, 52, 68, 84];
      let n = 1;
      const base = makeJet({ detail: 0.4, seed: 8 });
      const addJet = (x, z) => { const j = base.clone(true); j.position.set(x, 0, z); j.rotation.y = Math.PI + (rnd() - 0.5) * 0.05; fleet.add(j); n++; return j; };
      for (const x of cols) for (const z of rows) addJet(x, z);
      for (const z of [36, 52, 68, 84]) addJet(-6, z);
      for (const z of [52, 68, 84]) addJet(5.0 + 0, z + 0).position.x = 5;
      // blob shadows
      const sh = document.createElement("canvas"); sh.width = sh.height = 128; const sg = sh.getContext("2d"); const gr = sg.createRadialGradient(64, 64, 4, 64, 64, 62); gr.addColorStop(0, "rgba(0,0,0,0.62)"); gr.addColorStop(1, "rgba(0,0,0,0)"); sg.fillStyle = gr; sg.fillRect(0, 0, 128, 128);
      const shTex = new THREE.CanvasTexture(sh);
      fleet.children.forEach((j) => { const p = new THREE.Mesh(new THREE.PlaneGeometry(15, 11), new THREE.MeshBasicMaterial({ map: shTex, transparent: true, depthWrite: false })); p.rotation.x = -Math.PI / 2; p.position.set(j.position.x, 0.03, j.position.z); scene.add(p); });
      // tag on the hero's nose gear
      const tagPivot = new THREE.Group(); tagPivot.position.set(-6.12, 1.0, 15.45); scene.add(tagPivot);
      const tag = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.34, 0.14), new THREE.MeshStandardMaterial({ color: 0xef4444, roughness: 0.5, emissive: 0x551111 })); tag.position.y = -0.2; tagPivot.add(tag);

      // --- light: ceiling spots, volumetric cones, camera torch ------------------------------------------------------
      scene.add(new THREE.HemisphereLight(0x6f84a8, 0x14181e, 0.2));
      const spots = [[-6, 16], [-6, 36], [10, 14], [-20, 30], [20, 40], [4, 60], [-14, 60], [22, 76]];
      const coneMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false,
        uniforms: { uA: { value: 0.1 } },
        vertexShader: "varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vUv = uv; vec4 mv = modelViewMatrix * vec4(position,1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }",
        fragmentShader: "varying vec2 vUv; varying vec3 vN; varying vec3 vV; uniform float uA; void main(){ float f = abs(dot(normalize(vN), normalize(vV))); float a = pow(1.0 - vUv.y, 1.6) * pow(f, 1.4) * uA; gl_FragColor = vec4(vec3(0.62,0.78,1.0) * a, a); }" });
      for (const [x, z] of spots) {
        const s = new THREE.SpotLight(0xdfe9ff, 170, 46, 0.62, 0.85, 1.2); s.position.set(x, 14.4, z); s.target.position.set(x, 0, z); scene.add(s); scene.add(s.target);
        const cone = new THREE.Mesh(new THREE.ConeGeometry(4.6, 14, 32, 1, true), coneMat); cone.position.set(x, 7.4, z); cone.rotation.x = Math.PI; scene.add(cone);
      }
      const torch = new THREE.SpotLight(0xfff1dc, 8, 26, 0.5, 0.9, 1.8); scene.add(torch); scene.add(torch.target);
      const spill = new THREE.DirectionalLight(0xa9c2e6, 0); spill.position.set(0, 6, -30); spill.target.position.set(0, 0, 20); scene.add(spill); scene.add(spill.target);

      // dust
      const NP = 1800, pr = mulberry32(5), base3 = new Float32Array(NP * 3), ph = new Float32Array(NP);
      for (let i = 0; i < NP; i++) { base3[i * 3] = (pr() - 0.5) * 50; base3[i * 3 + 1] = pr() * 13; base3[i * 3 + 2] = pr() * 60 - 4; ph[i] = pr() * 6.28; }
      const dgeo = new THREE.BufferGeometry(); dgeo.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NP * 3), 3));
      const dust = new THREE.Points(dgeo, new THREE.PointsMaterial({ color: 0xcfe0ff, size: 0.045, transparent: true, opacity: 0.55, blending: THREE.AdditiveBlending, depthWrite: false, sizeAttenuation: true }));
      dust.frustumCulled = false; scene.add(dust);

      // --- camera path -------------------------------------------------------------------------------------------------
      // [t, position, look-at, fov]
      const K = [
        [0.0, [4, 1.7, -9], [4, 2.6, 8], 54],
        [2.4, [4, 1.7, -3], [4, 1.9, 11], 50],
        [4.6, [4, 1.66, 3.6], [2, 1.9, 14], 48],
        [7.8, [4.2, 1.66, 9.4], [-4, 2.0, 14], 46],
        [11.0, [1.6, 1.25, 12.8], [-5.2, 1.7, 14.2], 40],
        [14.0, [-3.0, 0.55, 14.6], [-5.8, 2.3, 16.8], 66],
        [17.0, [-11.8, 1.5, 13.2], [-6.0, 1.9, 14.8], 36],
        [20.2, [-13.0, 1.6, 17.0], [-6.1, 2.0, 18.4], 38],
        [20.8, [-14.0, 1.7, 17.6], [-6.0, 1.9, 19.4], 42],
        [25.4, [-14.2, 1.7, 17.8], [-6.0, 1.9, 19.5], 41],
        [26.6, [-12.6, 1.6, 21.6], [-6.0, 1.8, 24.0], 44],
        [28.4, [-9.6, 1.5, 28.2], [-6.0, 1.7, 27.0], 46],
        [29.6, [-6.6, 1.5, 30.2], [-6.0, 1.68, 26.2], 46],
        [30.1, [-6.0, 1.67, 28.6], [-6.0, 1.67, 22.0], 44],
        [30.8, [-6.0, 1.67, 26.4], [-6.0, 1.67, 19.0], 42],
        [33.2, [-6.0, 1.67, 22.6], [-6.0, 1.67, 17.0], 40],
        [33.8, [-6.0, 1.67, 23.4], [-6.0, 1.67, 18.5], 44],
        [34.8, [-6.0, 1.9, 29.0], [-5.5, 1.8, 20.0], 54],
        [37.2, [-3.0, 3.4, 38.0], [-4.0, 1.8, 20.0], 56],
        [41.3, [3.0, 6.8, 50.0], [-6.0, 1.4, 20.0], 58],
      ];
      const P = new THREE.CatmullRomCurve3(K.map((k) => new THREE.Vector3(...k[1])), false, "centripetal", 0.5);
      const Lk = new THREE.CatmullRomCurve3(K.map((k) => new THREE.Vector3(...k[2])), false, "centripetal", 0.5);
      const sample = (t) => { let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
        const f = clamp((t - K[i][0]) / (K[i + 1][0] - K[i][0])); const s = f * f * (3 - 2 * f); const u = (i + (f * 0.5 + s * 0.5)) / (K.length - 1);
        return { p: P.getPoint(u), l: Lk.getPoint(u), fov: lerp(K[i][3], K[i + 1][3], s) }; };
      const walk = (t) => seg(t, 2.4, 3.0) * (1 - seg(t, 7.8, 8.2)) + seg(t, 8.4, 9.0) * (1 - seg(t, 11.0, 11.6)) + seg(t, 25.6, 26.2) * (1 - seg(t, 29.5, 29.9));

      st.run((t) => {
        // door rises 0.3 → 2.4
        door.position.y = 8.1 + 15.5 * seg(t, 0.3, 2.4, ease.inOut2);
        spill.intensity = 1.8 * seg(t, 0.4, 2.6); coneMat.uniforms.uA.value = 0.1 + 0.05 * Math.sin(t * 0.4);
        const c = sample(t); const w = walk(t);
        const bob = 0.022 * w * Math.sin(t * 10.5), sway = 0.012 * w * Math.sin(t * 5.2);
        camera.position.set(c.p.x + sway, c.p.y + bob, c.p.z); camera.up.set(0.006 * w * Math.sin(t * 5.2), 1, 0); camera.lookAt(c.l); camera.fov = c.fov; camera.updateProjectionMatrix();
        torch.position.copy(camera.position); const dir = new THREE.Vector3().subVectors(c.l, c.p).normalize(); torch.target.position.copy(camera.position).addScaledVector(dir, 8);
        const tun = seg(t, 29.8, 30.4) * (1 - seg(t, 33.8, 34.4)); torch.intensity = 8 + 70 * tun; torch.angle = 0.5 + 0.2 * tun;
        tagPivot.rotation.z = (t > 19 ? 0.5 * Math.sin((t - 19) * 2.3) * Math.exp(-(t - 19) * 0.18) : 0);
        const pa = dgeo.attributes.position.array;
        for (let i = 0; i < NP; i++) { pa[i * 3] = base3[i * 3] + 0.5 * Math.sin(t * 0.23 + ph[i]); pa[i * 3 + 1] = (base3[i * 3 + 1] + 13 - t * 0.07) % 13 + 0.2 * Math.sin(t * 0.4 + ph[i] * 2); pa[i * 3 + 2] = base3[i * 3 + 2] + 0.4 * Math.cos(t * 0.19 + ph[i]); }
        dgeo.attributes.position.needsUpdate = true;
        st.fx.vig.darkness = 0.5 + 0.25 * tun;
      });
    </script>
  </body>
</html>
