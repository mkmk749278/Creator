        camera.up.set(0, 1, 0);
        tmp.set(c.l.x + 0.04 * n3 * (c.p.distanceTo(c.l) / 10), c.l.y + 0.03 * n1 * (c.p.distanceTo(c.l) / 10), c.l.z); camera.lookAt(tmp);
        camera.fov = c.fov * (1 + 0.04 * seg(t, 34.0, 34.3) * (1 - seg(t, 34.3, 34.8))); camera.updateProjectionMatrix();
        // torch = the visitor's light; strong only inside the bay

        torch.position.copy(camera.position); const dirv = new THREE.Vector3().subVectors(c.l, c.p).normalize(); torch.target.position.copy(camera.position).addScaledVector(dirv, 8);

        rim.intensity = 1.2 * open;
        tagPivot.rotation.z = (t > 19 ? 0.5 * Math.sin((t - 19) * 2.3) * Math.exp(-(t - 19) * 0.2) : 0);
        const dist = c.p.distanceTo(c.l); st.fx.dof.cocMaterial.focusDistance = Math.max(2, Math.min(dist, 40)); st.fx.dof.cocMaterial.focusRange = Math.max(2.2, dist * 0.45);
        const wh = Math.sin(clamp((t - 33.95) / 0.7) * Math.PI); st.fx.whip.uniforms.get("uAmt").value = 0.055 * wh; st.fx.whip.uniforms.get("uDir").value.set(1, 0.04);
        const pa = dgeo.attributes.position.array;
        for (let i = 0; i < NP; i++) { pa[i * 3] = b3[i * 3] + 0.5 * Math.sin(t * 0.23 + ph[i]); pa[i * 3 + 1] = (b3[i * 3 + 1] + 10 - t * 0.06) % 10 + 0.5 + 0.15 * Math.sin(t * 0.4 + ph[i] * 2); pa[i * 3 + 2] = b3[i * 3 + 2] + 0.4 * Math.cos(t * 0.19 + ph[i]); }
        dgeo.attributes.position.needsUpdate = true;
        st.fx.vig.darkness = 0.55 + 0.2 * tun;
      });
