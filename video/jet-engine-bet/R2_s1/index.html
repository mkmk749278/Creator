<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>R2 · The engine journey (shard 1)</title>
    <!-- Room 2 of "The Blade That Should Melt" (screenplay v2), 1:19.5-2:22.8 of the voice-over = 63.3 s, rendered in shards (T0 = shard start).
         One continuous camera: exterior X-ray reveal -> intake -> fan -> compressor (SQUEEZE) -> flame (BURN) -> turbine and exhaust (BLOW) ->
         back to the turbine "directly behind the fire". Generic turbofan (illustration). Cues = align.json lines 12-19 (offset 79.5 s). -->
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/jsm/", "three/examples/jsm/": "./vendor/three/jsm/", "postprocessing": "./vendor/pp/postprocessing.js", "simplex-noise": "./vendor/noise/simplex-noise.js", "n8ao": "./vendor/pp/N8AO.js" } }
    </script>
    <link rel="stylesheet" href="jep.css" />
    <style>
      html, body { margin: 0; background: #0B0E14; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #0B0E14; font-family: Inter, Arial, sans-serif; }
      #gl { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .lab { opacity: 0; } .lab small { color: #94A3B8; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="R2_s1" data-start="0" data-width="1920" data-height="1080" data-duration="16.0">
      <canvas id="gl"></canvas>
      <div class="jep-label lab" id="l1">Suck<small>air in</small></div>
      <div class="jep-label lab" id="l2">Squeeze<small>air packed and hot</small></div>
      <div class="jep-label lab" id="l3">Burn<small>fuel and fire</small></div>
      <div class="jep-label lab" id="l4">Blow<small>gas spins the turbine</small></div>
    </div>
    <script>
      const T0 = 16.0;
      const tl = gsap.timeline({ paused: true });
      const lab = (id, a, b) => { if (b - T0 > 0 && a - T0 < 16.0) { tl.fromTo(id, { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, Math.max(0, a - T0)); tl.to(id, { opacity: 0, duration: 0.4 }, Math.max(0.5, b - T0 - 0.4)); } };
      lab("#l1", 17.6, 24.0); lab("#l2", 24.2, 36.9); lab("#l3", 37.2, 46.8); lab("#l4", 47.0, 58.8);
      window.__timelines = window.__timelines || {}; window.__timelines["R2_s1"] = tl;
    </script>
    <script type="module">
      import { THREE, createStage, lightRig, backdrop, buildEngine, gasStream, setEnv, U, seg, ease, lerp, clamp, wob, aim, mulberry32 } from "./jebA.js";
      const T0 = 16.0;
      const st = createStage({ fov: 36, near: 0.03, far: 120, bloom: { intensity: 0.95, threshold: 1.1, smoothing: 0.25, radius: 0.75 }, vignette: 0.45 });
      const { scene, camera } = st;
      const bg = backdrop({ glowDir: [0.3, 0.2, 1], glow: 0.35 }); scene.add(bg);
      const L = lightRig(scene, { key: 1.2, rim: 3.2, fill: 0.35 });
      L.key.position.set(-4, 6, -3); L.rim.position.set(4, 3, 6); L.rim2.position.set(3, -2, -6); L.fill.position.set(-5, -3, 2);
      const E = buildEngine(scene);
      setEnv(scene, 0.42);
      const fire = new THREE.PointLight(0xff7a2a, 0, 7, 1.4); fire.position.set(0.3, 1.25, -1.7); scene.add(fire);
      const fire2 = new THREE.PointLight(0xff9a40, 0, 6, 1.4); fire2.position.set(0.2, 1.25, -0.3); scene.add(fire2);
      const gas = gasStream({ count: 1800, z0: -2.3, z1: 1.3, thetaRange: [0.05, Math.PI * 1.05], size: 24 }); scene.add(gas);
      E.hs.flames.userData.mat.uniforms.uIgn.value = 1.3;

      // air stream: cold air in at the intake, heating through the compressor, white-hot in the flame, orange out of the nozzle
      const NA = 3600, ar = mulberry32(91), seeds = new Float32Array(NA * 4);
      for (let i = 0; i < NA; i++) { seeds[i * 4] = ar(); seeds[i * 4 + 1] = ar(); seeds[i * 4 + 2] = ar(); seeds[i * 4 + 3] = ar(); }
      const ag = new THREE.BufferGeometry(); ag.setAttribute("position", new THREE.BufferAttribute(new Float32Array(NA * 3), 3)); ag.setAttribute("aSeed", new THREE.BufferAttribute(seeds, 4));
      const airMat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: { uClock: { value: 0 }, uAmt: { value: 0 }, uSize: { value: 30 } },
        vertexShader: `attribute vec4 aSeed; uniform float uClock, uAmt, uSize; varying vec3 vC; varying float vA;
          float rin(float z){ return z < -10.0 ? 0.62 : z < -3.4 ? mix(0.7, 1.18, (z + 10.0) / 6.6) : z < 1.9 ? 1.05 : mix(0.4, 0.3, clamp((z - 1.9) / 6.0, 0.0, 1.0)); }
          float rout(float z){ return z < -10.0 ? 2.3 : z < -3.4 ? mix(2.2, 1.46, (z + 10.0) / 6.6) : z < 1.9 ? 1.86 : 1.9; }
          void main(){
            float s = fract(aSeed.x + uClock * (0.055 + 0.03 * aSeed.w));
            float z = mix(-11.6, 8.9, s);
            float rI = rin(z) + 0.05, rO = rout(z) - 0.06;
            float r = mix(rI, rO, aSeed.y);
            float phi = -0.08 * 3.14159 + aSeed.z * 1.16 * 3.14159 + 0.9 * s;
            vec3 p = vec3(r * sin(phi), -r * cos(phi), z);
            float heat = smoothstep(-8.0, -3.4, z); float flame = smoothstep(-3.0, -1.6, z) * (1.0 - smoothstep(0.4, 1.4, z));
            vec3 cold = vec3(0.7, 0.88, 1.0), warm = vec3(1.0, 0.55, 0.2), hot = vec3(1.0, 0.92, 0.7);
            vC = mix(mix(cold, warm, heat), hot, flame) * (0.9 + 0.5 * flame + 0.4 * heat);
            vA = uAmt * smoothstep(0.0, 0.04, s) * (1.0 - smoothstep(0.94, 1.0, s)) * (0.45 + 0.55 * aSeed.w);
            vec4 mv = modelViewMatrix * vec4(p, 1.0); gl_Position = projectionMatrix * mv;
            gl_PointSize = uSize * (0.7 + 0.6 * aSeed.w) / max(-mv.z, 0.2); }`,
        fragmentShader: `varying vec3 vC; varying float vA; void main(){ vec2 d = gl_PointCoord - 0.5; float a = smoothstep(0.5, 0.0, length(d)); gl_FragColor = vec4(vC * a * vA, a * vA); }` });
      const air = new THREE.Points(ag, airMat); air.frustumCulled = false; scene.add(air);

      // camera path: [scene time, position, look-at, fov]; scene time = VO time - 79.5 s
      const K = [
        [0.0, [-15.5, 7.6, -15.0], [0, 0, -1.2], 34], [6.5, [-12.0, 4.6, -17.0], [0, 0.4, -4.5], 34],
        [12.0, [-6.0, 2.6, -15.0], [0, 0.5, -9.2], 36], [17.6, [-2.5, 0.95, -12.6], [-0.3, 0.7, -9.2], 40],
        [22.0, [-2.4, 0.9, -9.8], [-0.2, 0.7, -7.0], 40], [24.2, [-2.6, 1.0, -8.8], [-0.2, 0.7, -6.2], 38],
        [33.0, [-2.4, 1.1, -5.3], [-0.1, 0.9, -3.4], 30], [37.2, [-1.55, 1.0, -3.1], [0.0, 1.0, -1.0], 30],
        [43.0, [-1.4, 1.15, -1.5], [0.0, 1.1, 0.2], 36], [47.0, [-1.25, 1.3, -0.1], [0.0, 1.15, 1.6], 38],
        [52.0, [-1.0, 1.25, 1.4], [0.0, 1.0, 4.0], 40], [56.0, [-0.6, 0.9, 5.2], [0.0, 0.8, 8.0], 46],
        [58.9, [-0.3, 0.9, 8.0], [0.0, 0.9, 11.0], 56], [60.0, [-2.8, 1.6, 4.0], [0.0, 1.1, 0.6], 40], [63.3, [-2.4, 1.3, 2.2], [0.05, 1.15, 0.3], 36],
      ];
      const P = new THREE.CatmullRomCurve3(K.map((k) => new THREE.Vector3(...k[1])), false, "centripetal", 0.5);
      const Lk = new THREE.CatmullRomCurve3(K.map((k) => new THREE.Vector3(...k[2])), false, "centripetal", 0.5);
      const sample = (t) => { let i = 0; while (i < K.length - 2 && t > K[i + 1][0]) i++;
        const f = clamp((t - K[i][0]) / (K[i + 1][0] - K[i][0])); const s = f * f * (3 - 2 * f); const u = (i + (f * 0.45 + s * 0.55)) / (K.length - 1);
        return { p: P.getPoint(u), l: Lk.getPoint(u), fov: lerp(K[i][3], K[i + 1][3], s) }; };
      st.run((tt) => {
        const t = T0 + tt;
        // blueprint -> metal sweep (front to back), grid fades
        U.uSweepOn.value = 1; U.uSweep.value = lerp(-12.5, 9.5, seg(t, 0.5, 6.5, ease.inOut2));
        bg.material.uniforms.uGrid.value = 1 - seg(t, 2.5, 8.0);
        E.lineMat.uniforms.uAmt.value = 1 - seg(t, 5.0, 10.0);
        const spinK = 1.0 + 1.6 * seg(t, 12, 24);                 // the fan speeds up as the engine "breathes"
        for (const r of E.rotors) r.g.rotation.z = -(r.z < -8 ? 1.2 : 2.6) * spinK * (t * 0.8 + 0.2 * Math.sin(t * 0.5));
        E.hs.spin(-2.2 * t);
        if (E.hs.holes) E.hs.holes.visible = U.uSweep.value > 0.3;
        // air: appears at the intake, flows for the rest of the journey
        airMat.uniforms.uClock.value = t; airMat.uniforms.uAmt.value = 1.05 * seg(t, 14, 18) * (1 - 0.35 * seg(t, 56, 60));
        // heat story: compressor warms, flame ignites at BURN, turbine glows at BLOW
        const burn = seg(t, 36.0, 38.5), blow = seg(t, 46.0, 49.0);
        gas.visible = true; gas.material.uniforms.uAmt.value = 0.95 * seg(t, 37.5, 40.5);
        E.hs.flames.visible = true; E.hs.flames.userData.mat.uniforms.uAmt.value = burn * (1 - 0.15 * seg(t, 58, 62));
        fire.intensity = 5.0 * burn * (1 - 0.35 * seg(t, 47, 52)); fire2.intensity = 3.5 * burn;
        U.uHeat.value = 0.05 + 0.15 * seg(t, 24, 36) + 0.2 * burn + 0.15 * blow;
        const c = sample(t);
        aim(camera, c.p.toArray(), c.l.toArray(), 0.025 * Math.sin(t * 0.8) + 0.015 * Math.sin(t * 2.3));
        camera.fov = c.fov * (1 + 0.18 * seg(t, 58.6, 59.0) * (1 - seg(t, 59.0, 60.2))); camera.updateProjectionMatrix();
        st.fx.vig.darkness = 0.45 + 0.25 * seg(t, 24, 36) * (1 - seg(t, 36, 38));      // the frame tightens while the air is squeezed
        st.fx.bloom.intensity = 0.9 + 1.1 * burn * (1 - seg(t, 44, 49));
        st.setShimmer(0.5 * burn, 0.5, 0.5, 0.45, 0.4);
      });
    </script>
  </body>
</html>
