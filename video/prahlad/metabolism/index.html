<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Hypometabolism hypothesis</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="shared/fx.js"></script>
    <link rel="stylesheet" href="shared/theme.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      .gauge { position: absolute; left: 190px; top: 170px; width: 760px; height: 760px; }
      .read { position: absolute; left: 190px; top: 690px; width: 760px; text-align: center; }
      .read .v { display: inline-block; font-size: 120px; font-weight: 800; font-variant-numeric: tabular-nums; width: 420px; }
      .read .k { display: block; font-size: 30px; font-weight: 800; letter-spacing: 0.16em; color: var(--ink-dim); }
      .fig { position: absolute; right: 200px; top: 190px; width: 620px; height: 700px; }
      .ring { position: absolute; left: 50%; top: 46%; width: 300px; height: 300px; margin: -150px 0 0 -150px; border-radius: 50%; border: 3px solid rgba(255,211,77,0.7); }
      .hyp { position: absolute; left: 64px; top: 56px; padding: 12px 20px; border-radius: 6px; font-size: 26px; font-weight: 800; letter-spacing: 0.1em; color: #1a1200; background: var(--amber); }
      .cap { position: absolute; left: 64px; bottom: 60px; font-size: 40px; font-weight: 800; }
      .cap small { display: block; font-size: 26px; font-weight: 600; color: var(--ink-dim); margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="metabolism" data-start="0" data-width="1920" data-height="1080" data-duration="8">
      <div class="bg" id="bg"><div class="base"></div><div class="glow-a"></div><div class="glow-b"></div></div>
      <div class="particles" id="dust"></div>
      <svg class="gauge" viewBox="0 0 760 760">
        <defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5a7bc0"/><stop offset="0.6" stop-color="#ffd34d"/><stop offset="1" stop-color="#ff8a3d"/></linearGradient>
          <filter id="g2"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <path d="M110 520 A 290 290 0 1 1 650 520" fill="none" stroke="rgba(159,176,214,0.18)" stroke-width="44" stroke-linecap="round"/>
        <path id="arc" d="M110 520 A 290 290 0 1 1 650 520" fill="none" stroke="url(#ag)" stroke-width="44" stroke-linecap="round" filter="url(#g2)"/>
        <g id="ticks" stroke="rgba(246,247,251,0.55)" stroke-width="4"></g>
        <g id="needle"><path d="M374 410 L380 190 L386 410 Z" fill="#f6f7fb" stroke="#f6f7fb" stroke-width="4" stroke-linejoin="round"/><circle cx="380" cy="410" r="26" fill="#f6f7fb"/></g>
      </svg>
      <div class="read"><span class="v" id="val">100</span><span class="k">METABOLIC RATE · % OF NORMAL</span></div>
      <div class="fig" id="fig">
        <div class="ring" id="r1"></div><div class="ring" id="r2"></div><div class="ring" id="r3"></div>
        <svg viewBox="0 0 620 700" style="position:absolute; inset:0">
          <defs><radialGradient id="bodyG" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ff9a3d"/></radialGradient>
            <filter id="g3"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <g id="body" fill="url(#bodyG)" filter="url(#g3)">
            <circle cx="310" cy="170" r="62"/>
            <path d="M240 250 Q310 225 380 250 L410 420 Q310 450 210 420 Z"/>
            <path d="M210 410 Q150 440 140 500 Q230 540 310 520 Q390 540 480 500 Q470 440 410 410 Q310 450 210 410 Z"/>
            <path d="M240 270 Q190 340 215 430 L240 425 Q225 350 262 290 Z"/><path d="M380 270 Q430 340 405 430 L380 425 Q395 350 358 290 Z"/>
          </g>
        </svg>
      </div>
      <div class="hyp">HYPOTHESIS · NOT MEASURED IN THE STUDY</div>
      <div class="cap">Extreme hypometabolism?<small>The idea: energy use falls so low that the body needs almost nothing</small></div>
      <div class="vignette"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      FX.drift(tl, "#bg", 8);
      FX.dust(tl, document.getElementById("dust"), { seed: 13, count: 50, dur: 8 });
      const ticks = document.getElementById("ticks");
      for (let i = 0; i <= 10; i++) { const a = (-225 + i * 27) * Math.PI / 180, l = document.createElementNS("http://www.w3.org/2000/svg", "line");
        l.setAttribute("x1", 380 + 330 * Math.cos(a)); l.setAttribute("y1", 410 + 330 * Math.sin(a)); l.setAttribute("x2", 380 + 352 * Math.cos(a)); l.setAttribute("y2", 410 + 352 * Math.sin(a)); ticks.appendChild(l); }
      const arc = document.getElementById("arc"), L = arc.getTotalLength(); arc.style.strokeDasharray = L;
      // needle sweep: 100% sits at +135°, 0% at -135°
      tl.fromTo("#needle", { rotation: 112, svgOrigin: "380 410" }, { rotation: -87, svgOrigin: "380 410", duration: 5.5, ease: "power2.inOut" }, 1.0);
      tl.fromTo(arc, { strokeDashoffset: 0 }, { strokeDashoffset: L * 0.89, duration: 5.5, ease: "power2.inOut" }, 1.0);
      const st = { v: 100 }, val = document.getElementById("val");
      tl.to(st, { v: 11, duration: 5.5, ease: "power2.inOut", onUpdate: () => { val.textContent = Math.round(st.v); } }, 1.0);
      // breathing rings slow down as the rate falls (fixed, finite tweens)
      let t0 = 0.2; for (let k = 0; k < 6; k++) { const per = 1.0 + k * 0.45; for (const [i, id] of ["#r1", "#r2", "#r3"].entries()) {
        tl.fromTo(id, { scale: 0.9, opacity: 0.8 }, { scale: 2.3, opacity: 0, duration: per * 1.6, ease: "power1.out", immediateRender: false }, t0 + i * per * 0.33); }
        t0 += per; if (t0 > 7.5) break; }
      tl.fromTo("#body", { opacity: 1 }, { opacity: 0.45, duration: 5.5, ease: "power2.inOut" }, 1.0);
      window.__timelines["metabolism"] = tl;
    </script>
  </body>
</html>
