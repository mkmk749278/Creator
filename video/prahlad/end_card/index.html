<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Be Practical end card</title>
    <script src="vendor/gsap.min.js"></script>
    <script src="shared/fx.js"></script>
    <link rel="stylesheet" href="shared/theme.css" />
    <style>
      @font-face { font-family: "Inter"; font-weight: 400; src: url("vendor/fonts/inter-latin-400-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
      .left { position: absolute; left: 120px; top: 0; bottom: 0; width: 760px; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 44px; }
      .logo { width: 400px; height: 400px; border-radius: 40px; box-shadow: 0 30px 80px rgba(0,0,0,0.5), 0 0 0 2px rgba(255,211,77,0.35); display: block; }
      .sub { display: flex; align-items: center; gap: 22px; padding: 26px 54px; border-radius: 999px; background: #e62117; font-size: 46px; font-weight: 800; letter-spacing: 0.04em; box-shadow: 0 18px 40px rgba(230,33,23,0.35); }
      .bell { width: 46px; height: 46px; display: block; }
      .ask { font-size: 36px; font-weight: 600; color: var(--ink-dim); text-align: center; }
      .right { position: absolute; right: 120px; top: 0; bottom: 0; width: 820px; display: flex; flex-direction: column; justify-content: center; gap: 56px; }
      .slot { height: 340px; border-radius: 22px; border: 2px dashed rgba(159,176,214,0.45); background: rgba(5,10,24,0.35); display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 600; letter-spacing: 0.1em; color: rgba(159,176,214,0.75); }
      .cursor { position: absolute; width: 60px; height: 60px; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="end-card" data-start="0" data-width="1920" data-height="1080" data-duration="10">
      <div class="bg" id="bg"><div class="base"></div><div class="glow-a"></div><div class="glow-b"></div><div class="grid"></div></div>
      <div class="particles" id="dust"></div>
      <div class="left">
        <img class="logo" id="logo" src="shared/logo_square.png" alt="Be Practical with Kishore" />
        <div class="sub" id="sub">
          <svg class="bell" id="bell" viewBox="0 0 24 24"><path fill="#fff" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
          SUBSCRIBE
        </div>
        <div class="ask" id="ask">Like · Share · Comment your opinion</div>
      </div>
      <div class="right">
        <div class="slot" id="slot1">NEXT VIDEO</div>
        <div class="slot" id="slot2">RECOMMENDED</div>
      </div>
      <svg class="cursor" id="cursor" viewBox="0 0 24 24"><path fill="#fff" stroke="#000" stroke-width="1" d="M4 2l14 9-6.5 1.2L15 20l-3 1.4-3.4-7.6L4 18z"/></svg>
      <div class="vignette"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      FX.drift(tl, "#bg", 10);
      FX.dust(tl, document.getElementById("dust"), { seed: 11, count: 60, dur: 10 });
      tl.fromTo("#logo", { scale: 0.6, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.9, ease: "back.out(1.6)" }, 0.1);
      tl.fromTo("#sub", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 0.6);
      tl.fromTo("#ask", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.0);
      tl.fromTo(".slot", { x: 120, opacity: 0 }, { x: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.15 }, 0.5);
      // cursor glides in and clicks subscribe; the button turns grey "SUBSCRIBED" style with a bell ring
      tl.fromTo("#cursor", { x: 1500, y: 1000, opacity: 0 }, { x: 640, y: 690, opacity: 1, duration: 1.2, ease: "power2.inOut" }, 1.6);
      tl.to("#cursor", { scale: 0.8, duration: 0.12, yoyo: true, repeat: 1 }, 2.85);
      tl.to("#sub", { scale: 0.94, duration: 0.12, yoyo: true, repeat: 1 }, 2.85);
      tl.to("#sub", { backgroundColor: "#3a4766", boxShadow: "0 18px 40px rgba(0,0,0,0.35)", duration: 0.25 }, 3.05);
      tl.fromTo("#bell", { rotation: 0 }, { rotation: 18, duration: 0.09, yoyo: true, repeat: 7, ease: "sine.inOut", transformOrigin: "50% 10%" }, 3.2);
      tl.to("#cursor", { x: 1500, y: 1150, opacity: 0, duration: 1.0, ease: "power2.in" }, 4.0);
      tl.fromTo("#logo", { y: 0 }, { y: -10, duration: 2.5, yoyo: true, repeat: 2, ease: "sine.inOut", immediateRender: false }, 2.0);
      window.__timelines["end-card"] = tl;
    </script>
  </body>
</html>
