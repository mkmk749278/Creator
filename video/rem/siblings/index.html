    <script type="module">
      import * as THREE from "three";
      import { HDRLoader } from "three/addons/loaders/HDRLoader.js";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { EffectComposer, RenderPass, EffectPass, BloomEffect, ToneMappingEffect, ToneMappingMode, VignetteEffect } from "postprocessing";
      import { createNoise3D } from "simplex-noise";
      const root = document.getElementById("root");
      const W = +root.dataset.width, H = +root.dataset.height, DUR = +root.dataset.duration;
      const mulberry32 = (s) => () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rng = mulberry32(42), noise = createNoise3D(mulberry32(7));
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const seg = (t, a, b) => ease((t - a) / (b - a));   // 0 -> 1 between seconds a and b
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("gl"), antialias: false, stencil: false,
        depth: false, powerPreference: "high-performance", preserveDrawingBuffer: true });
      renderer.setPixelRatio(1); renderer.setSize(W, H, false);
      renderer.toneMapping = THREE.NoToneMapping;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x070a0f);
      scene.fog = new THREE.Fog(0x070a0f, 12, 34);
      const camera = new THREE.PerspectiveCamera(32, W / H, 0.05, 200);
      const composer = new EffectComposer(renderer, { frameBufferType: THREE.HalfFloatType });
      composer.addPass(new RenderPass(scene, camera));
      composer.addPass(new EffectPass(camera, new BloomEffect({ intensity: 0.8, luminanceThreshold: 0.72, mipmapBlur: true }),
        new VignetteEffect({ darkness: 0.5, offset: 0.28 }), new ToneMappingEffect({ mode: ToneMappingMode.AGX })));
      composer.setSize(W, H);
      const key = new THREE.DirectionalLight(0xfff1e0, 1.6); key.position.set(4, 6, 5); scene.add(key);
      const rim = new THREE.DirectionalLight(0x7fb8ff, 2.2); rim.position.set(-5, 2, -4); scene.add(rim);
      const shadowDisc = (r, y, o = 0.6) => {   // fake contact shadow: radial-gradient texture on a floor disc
        const c = document.createElement("canvas"); c.width = c.height = 128; const g = c.getContext("2d");
        const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, `rgba(0,0,0,${o})`); gr.addColorStop(1, "rgba(0,0,0,0)");
        g.fillStyle = gr; g.fillRect(0, 0, 128, 128);
        const m = new THREE.Mesh(new THREE.PlaneGeometry(r * 2, r * 2), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(c), transparent: true, depthWrite: false }));
        m.rotation.x = -Math.PI / 2; m.position.y = y; return m;
      };

      const N = 17, balls = [], seeds = [];

        const tint = new THREE.Color().setHSL(0.58 + (rng() - 0.5) * 0.03, 0.12, 0.62 + (rng() - 0.5) * 0.05);  // almost the same
        const m = new THREE.Mesh(new THREE.SphereGeometry(0.38 + (rng() - 0.5) * 0.03, 64, 48),
          new THREE.MeshPhysicalMaterial({ color: tint, metalness: 0.95, roughness: 0.25, clearcoat: 0.6, emissive: 0x58a6ff, emissiveIntensity: 0 }));
        scene.add(m); balls.push(m);
        const a = i * 2.39996, r = 0.42 * Math.sqrt(i + 0.5);   // sunflower packing
        seeds.push({ x: Math.cos(a) * r, z: Math.sin(a) * r, p: rng() * 10 });
      }
      scene.add(shadowDisc(3.4, -0.4, 0.7));
      const floor = new THREE.Mesh(new THREE.CircleGeometry(9, 64), new THREE.MeshStandardMaterial({ color: 0x06090d, metalness: 0.0, roughness: 0.9, envMapIntensity: 0.15 }));
      floor.rotation.x = -Math.PI / 2; floor.position.y = -0.41;   // not added: a lit floor read as grey haze
      function renderAt(t) {
        balls.forEach((b, i) => {
          const s = seeds[i];
          b.position.set(s.x + 0.06 * noise(s.p, t * 0.6, 0), 0.02 + 0.03 * Math.abs(noise(s.p, t * 0.8, 3)), s.z + 0.06 * noise(0, t * 0.6, s.p));
          b.material.emissiveIntensity = 0;
        });
        // the one that tries to leave (sibling 16)
        const out = seg(t, 12.6, 15.0) * (1 - seg(t, 16.0, 17.6));   // film 126.0 s = scene 0: leaves on 'pull one of them out' (138.8 s)
        const b = balls[16]; b.position.x += 1.6 * out; b.position.z += 0.5 * out; b.material.emissiveIntensity = 1.6 * out;
        const a = 0.3 + 0.25 * (t / DUR), r = 6.4 - 0.8 * (t / DUR);
        camera.position.set(Math.sin(a) * r, 2.4, Math.cos(a) * r); camera.lookAt(0.2, 0, 0);
      }

      new HDRLoader().loadAsync("vendor/library/hdri/studio_small_09_1k.hdr").then((tex) => {
        const pm = new THREE.PMREMGenerator(renderer);
        scene.environment = pm.fromEquirectangular(tex).texture; tex.dispose(); pm.dispose();
        window.addEventListener("hf-seek", (ev) => { renderAt(ev.detail.time); composer.render(); });
        renderAt(window.__hfThreeTime || 0); composer.render();
      });
