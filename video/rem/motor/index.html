      import { EffectComposer, RenderPass, EffectPass, BloomEffect, ToneMappingEffect, ToneMappingMode, VignetteEffect } from "postprocessing";
      import { createNoise3D } from "simplex-noise";
      const root = document.getElementById("root");
      const W = +root.dataset.width, H = +root.dataset.height, DUR = +root.dataset.duration;
      const mulberry32 = (s) => () => { s = (s + 0x6d2b79f5) >>> 0; let t = s; t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
      const rng = mulberry32(42), noise = createNoise3D(mulberry32(7));
      const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
      const ease = (x) => { x = clamp(x); return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
      const seg = (t, a, b) => ease((t - a) / (b - a));   // 0 -> 1 between seconds a and b

      composer.addPass(new EffectPass(camera, new BloomEffect({ intensity: 0.9, luminanceThreshold: 0.72, mipmapBlur: true }),

      composer.setSize(W, H);

      const rim = new THREE.DirectionalLight(0x7fb8ff, 2.2); rim.position.set(-5, 2, -4); scene.add(rim);
      const shadowDisc = (r, y, o = 0.6) => {   // fake contact shadow: radial-gradient texture on a floor disc
