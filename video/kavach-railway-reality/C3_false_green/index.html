<script>
  const S = buildBalasore(), D = CUES.duration;
  const tl = gsap.timeline({ paused: true });
  balasoreEndState(tl, S);
  const K = addKavachBadge(S);
  // interlocking cabinet + its wires to the signal and to Kavach (generic; ILLUSTRATION)
  const NS = "http://www.w3.org/2000/svg", ix = 150, iy = 250;
  const cab = document.createElementNS(NS, "g"); cab.setAttribute("id", "cab");
  let relays = ""; for (let r = 0; r < 3; r++) for (let c = 0; c < 8; c++) relays += `<rect class="relay" x="${ix + 24 + c * 30}" y="${iy + 62 + r * 26}" width="20" height="14" rx="3" fill="#1E293B"/>`;
  cab.innerHTML = `<rect x="${ix}" y="${iy}" width="290" height="160" rx="12" fill="#0B1220" stroke="#5B6B86" stroke-width="3"/>
    <text x="${ix + 145}" y="${iy + 40}" text-anchor="middle" style="font: 800 22px Inter, Arial, sans-serif; letter-spacing: 0.16em; fill: #CBD5E1">INTERLOCKING</text>${relays}
    <path id="wire-sig" d="M ${ix + 290} ${iy + 60} L 560 ${iy + 60} L 560 340 L 614 340" fill="none" stroke="#475569" stroke-width="4"/>
    <path id="wire-kav" d="M ${ix + 145} ${iy + 160} L ${ix + 145} 760 L 610 760 L 610 724" fill="none" stroke="#475569" stroke-width="4"/>
    <circle id="pk1" r="11" fill="#4ADE80" stroke="#DC2626" stroke-width="4" opacity="0"/>
    <circle id="pk2" r="11" fill="#4ADE80" stroke="#DC2626" stroke-width="4" opacity="0"/>
    <g id="tags" opacity="0">${[1060, 1180, 1300, 1420].map((x) => `<circle cx="${x}" cy="${S.Y_LOOP + 40}" r="13" fill="none" stroke="#38BDF8" stroke-width="3" stroke-dasharray="4 5"/>`).join("")}</g>`;
  S.q("#world").insertBefore(cab, S.q("#signal"));
  const along = (pk, path, t0, dur) => {  // move a packet along a wire path as a pure function of time
    const p = S.q(path), L = p.getTotalLength(), o = { u: 0 };
    tl.set(pk, { opacity: 1 }, t0);
    tl.to(o, { u: 1, duration: dur, ease: "power1.inOut", onUpdate: () => { const q = p.getPointAtLength(o.u * L); S.q(pk).setAttribute("cx", q.x); S.q(pk).setAttribute("cy", q.y); } }, t0);
    tl.set(pk, { opacity: 0 }, t0 + dur + 0.05);
  };
  // camera: schematic sits left; at V046 it slides further left and dims under the panel
  tl.fromTo("#world", { transformOrigin: "50% 50%", scale: 1.05, x: 60, y: -10 }, { scale: 1.12, x: 20, y: -20, duration: CUES.cues.V046.at, ease: "sine.inOut" }, 0);
  tl.to("#world", { scale: 1.0, x: -380, y: -20, opacity: 0.55, duration: 1.2, ease: "power2.inOut" }, CUES.cues.V046.at - 0.3);
  tl.to("#world", { scale: 1.05, x: -420, duration: at("V046", "Kavach does have a few checks") - CUES.cues.V046.at - 0.9, ease: "sine.inOut" }, CUES.cues.V046.at + 0.9);
  tl.fromTo("#sweep", { x: 0 }, { x: 3200, duration: D, ease: "none" }, 0);
  tl.set("#hud .dot", { opacity: 1 }, 0);
  // V045: "Remember interlocking?" the cabinet lights; a false green goes to the signal, then the same into Kavach
  const t0 = CUES.cues.V045.at;
  tl.from("#cab", { opacity: 0, duration: 0.6 }, t0);
  tl.to(".relay", { attr: { fill: "#4ADE80" }, duration: 0.15, stagger: { each: 0.04, from: "random" } }, t0 + 0.4);
  tl.to("#cab rect:first-child", { attr: { stroke: "#F8FAFC" }, duration: 0.3, yoyo: true, repeat: 3 }, t0 + 0.3);
  const tFalse = at("V045", "showing a false green");
  tl.to("#wire-sig", { attr: { stroke: "#4ADE80" }, duration: 0.4 }, tFalse);
  along("#pk1", "#wire-sig", tFalse, 1.4);
  tl.to("#lamp-g-on", { opacity: 0.35, duration: 0.18, yoyo: true, repeat: 5 }, tFalse + 1.4);
  const tSame = at("V045", "fed that same wrong information");
  tl.to("#lab1", { opacity: 1, duration: 0.6 }, tSame);
  tl.to("#wire-kav", { attr: { stroke: "#4ADE80" }, duration: 0.4 }, tSame);
  along("#pk2", "#wire-kav", tSame, 1.6);
  const tClear = at("V045", "believed the line was clear");
  tl.to("#kbadge rect", { attr: { stroke: "#4ADE80" }, duration: 0.4 }, tClear);
  tl.to("#kbadge line", { attr: { stroke: "#4ADE80" }, duration: 0.4 }, tClear);
  tl.fromTo("#kring", { attr: { r: 54 }, opacity: 0.8, stroke: "#4ADE80" }, { attr: { r: 120 }, opacity: 0, duration: 1.2, repeat: 1 }, tClear);
  // V046: inside Kavach, both channels agree on the same wrong input and the gate opens
  const t1 = CUES.cues.V046.at;
  tl.to("#lab1", { opacity: 0, duration: 0.4 }, t1);
  tl.from("#panel", { opacity: 0, x: 80, duration: 0.8, ease: "power3.out" }, t1 + 0.1);
  tl.from("#inpt", { opacity: 0, y: -20, duration: 0.5 }, t1 + 0.7);
  tl.from("#w-a, #w-b", { attr: { d: "M 210 166 L 210 166" }, duration: 0.5, stagger: 0.1 }, t1 + 1.2);
  tl.to("#ok-a", { opacity: 1, duration: 0.3 }, t1 + 1.8);
  tl.to("#ok-b", { opacity: 1, duration: 0.3 }, t1 + 2.1);
  tl.to("#ch-a rect, #ch-b rect", { attr: { stroke: "#4ADE80" }, duration: 0.3 }, t1 + 2.1);
  tl.from("#w-out", { opacity: 0, duration: 0.4 }, t1 + 2.5);
  tl.to("#gate-l", { x: -150, duration: 0.8, ease: "power2.inOut" }, t1 + 2.9);
  tl.to("#gate-r", { x: 150, duration: 0.8, ease: "power2.inOut" }, t1 + 2.9);
  tl.to("#gate-t", { opacity: 1, duration: 0.4 }, t1 + 3.4);
  const tChecks = at("V046", "Kavach does have a few checks");
  tl.to("#tags", { opacity: 1, duration: 0.5 }, tChecks);
  tl.to("#tags circle", { attr: { r: 22 }, opacity: 0.25, duration: 0.8, stagger: 0.15, yoyo: true, repeat: 3, ease: "sine.inOut" }, tChecks + 0.3);
  tl.to("#panel", { x: 760, opacity: 0, duration: 0.9, ease: "power2.in" }, tChecks - 0.2);
  tl.to("#world", { opacity: 1, scale: 1.25, x: -60, y: 40, duration: D - tChecks, ease: "sine.inOut" }, tChecks - 0.2);
  const tNo = at("V046", "no public study");
  tl.to("#lab2", { opacity: 1, duration: 0.6 }, tNo);
  window.__timelines = window.__timelines || {};
  window.__timelines["C3_false_green"] = tl;
