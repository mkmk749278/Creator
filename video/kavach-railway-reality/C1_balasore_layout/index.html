<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>C1 Balasore layout</title>
<style>
  @font-face { font-family: "Inter"; font-weight: 600; src: url("vendor/fonts/inter-latin-600-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("vendor/fonts/inter-latin-800-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; font-weight: 400 800; src: url("vendor/fonts/inter-latin-ext-600-normal.woff2") format("woff2");
    unicode-range: U+20B9, U+0100-024F, U+2000-206F, U+2190-21FF, U+2248, U+2260; }
</style>
<link rel="stylesheet" href="kav.css" />
<style>
  html, body { margin: 0; background: #0F172A; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: #0F172A url(slate.jpg) center/cover; font-family: Inter, Arial, sans-serif; }
  #schem { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  .tlabel { font: 800 22px Inter, Arial, sans-serif; letter-spacing: 0.14em; fill: #94A3B8; }
  .tlabel.amber { fill: #F59E0B; } .tlabel.red { fill: #F87171; }
  .tnum { font: 800 30px Inter, Arial, sans-serif; fill: #F8FAFC; letter-spacing: 0.02em; }
  #sweep { position: absolute; top: -200px; left: -900px; width: 700px; height: 1480px; transform: rotate(14deg);
    background: linear-gradient(90deg, rgba(56,189,248,0), rgba(56,189,248,0.07), rgba(56,189,248,0)); }
  #grain { position: absolute; inset: 0; background: url(grain.png); mix-blend-mode: overlay; opacity: 0.9; pointer-events: none; }
  #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 55%, rgba(0,0,0,0) 55%, rgba(0,0,0,0.55) 100%); }
  .kav-label { opacity: 0; }
  #hud { position: absolute; left: 96px; top: 72px; font: 800 22px Inter, Arial, sans-serif; letter-spacing: 0.16em; color: rgba(248,250,252,0.72); }
  #hud .dot { display: inline-block; width: 12px; height: 12px; border-radius: 6px; background: #DC2626; margin-right: 14px; vertical-align: 1px; }
</style>
</head>
<body>
<div id="root" data-composition-id="C1_balasore_layout" data-start="0" data-width="1920" data-height="1080" data-duration="19.27">
  <svg id="schem" viewBox="0 0 1920 1080" data-layout-allow-overflow></svg>
  <div id="sweep" data-layout-allow-occlusion></div>
  <div id="vig" data-layout-allow-occlusion></div>
  <div id="hud"><span class="dot"></span>02.06.2023 · 18:56 · BAHANAGA BAZAR</div>
  <div class="kav-label" id="lab1">Bahanaga Bazar · 2 Jun 2023<small>BALASORE, ODISHA</small></div>
  <div class="kav-label red" id="lab2">Crossover 17A/B → Loop<small>WHERE A GOODS TRAIN STOOD</small></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="cues.js"></script>
<script src="kav.js"></script>
<script src="indsig.js"></script>
<script src="balasore.js"></script>
<script>
  const S = buildBalasore(), D = CUES.duration;
  const tl = gsap.timeline({ paused: true });
  const dash = (sel) => { const p = S.q(sel), L = p.getTotalLength(); p.setAttribute("stroke-dasharray", L); p.setAttribute("stroke-dashoffset", L); return L; };
  // camera: slow push-in and drift, then a pan toward the points on "crossover"
  tl.fromTo("#world", { transformOrigin: "50% 50%", scale: 1.12, x: 140, y: 70 }, { scale: 1.2, x: 60, y: 80, duration: at("V041", "But the crossover"), ease: "sine.inOut" }, 0);
  tl.to("#world", { scale: 1.28, x: 40, y: 90, duration: D - at("V041", "But the crossover"), ease: "sine.inOut" }, at("V041", "But the crossover"));
  tl.fromTo("#sweep", { x: 0 }, { x: 3200, duration: D, ease: "none" }, 0);
  // the diagram draws in (first ~2.5 s are under the coordinator's archive cut, so it keeps moving behind it)
  tl.from("#t-down, #t-main, #t-dloop", { opacity: 0, duration: 1.2, stagger: 0.3 }, 0.1);
  tl.from("#goods2 rect", { opacity: 0, x: 30, duration: 0.5, stagger: 0.05 }, 1.8);
  tl.fromTo("#bnc", { x: 400 }, { x: -700, duration: D, ease: "none" }, 0);
  tl.from("#t-xover, #t-loop, #t-xout", { opacity: 0, duration: 1.0, stagger: 0.25 }, 0.9);
  tl.from("#goods rect", { opacity: 0, x: 30, duration: 0.5, stagger: 0.06 }, 1.6);
  tl.from("#signal", { opacity: 0, y: 20, duration: 0.7 }, 2.0);
  tl.from("#hud", { opacity: 0, duration: 0.8 }, 0.4);
  tl.to("#hud .dot", { opacity: 0.25, duration: 0.5, yoyo: true, repeat: Math.floor(D / 1.0) - 1, ease: "sine.inOut" }, 0.5);
  tl.to("#lab1", { opacity: 1, x: 0, duration: 0.6, ease: "power2.out" }, at("V040", "Bahanaga Bazar"));
  // Coromandel enters on the up main and runs toward the signal
  const tIn = at("V040", "The Coromandel"), tSig = at("V040", "on a green signal");
  tl.fromTo("#coro", { x: -200 }, { x: 668, duration: (CUES.cues.V040.to - tIn) + 0.4, ease: "none" }, tIn - 0.4);
  tl.fromTo("#speed", { x: -200, opacity: 0 }, { x: 668, duration: (CUES.cues.V040.to - tIn) + 0.4, ease: "none" }, tIn - 0.4);
  tl.to("#speed", { opacity: 1, duration: 0.4 }, at("V040", "one hundred and twenty eight"));
  // signal: red -> green for the main line; the promised route lights along the main
  // the home signal showed green for the main line all along (CRS); it pulses when the narration names it
  tl.set("#lamp-g-on", { opacity: 1 }, 0);
  tl.fromTo("#lamp-g-on", { attr: { r: 12.6 } }, { attr: { r: 17 }, duration: 0.3, yoyo: true, repeat: 3 }, tSig);
  const Lm = dash("#route-main");
  tl.set("#route-main", { opacity: 0.9 }, tSig + 0.2);
  tl.to("#route-main", { attr: { "stroke-dashoffset": 0 }, duration: 0.9, ease: "power2.out" }, tSig + 0.2);
  // V041: the points are set toward the loop; the real route turns crimson into the occupied loop
  const tX = at("V041", "But the crossover"), tG = at("V041", "where a goods train");
  tl.to("#lab1", { opacity: 0, duration: 0.3 }, tX);
  tl.to("#lbl-down", { opacity: 0, duration: 0.4 }, tX);
  tl.to("#pts-ring", { opacity: 1, scale: 1.4, transformOrigin: "50% 50%", duration: 0.5, yoyo: true, repeat: 3 }, tX);
  tl.to("#blade", { rotation: -36, svgOrigin: "0 0", duration: 0.7, ease: "power3.inOut" }, tX + 0.3);
  tl.to("#pts-label", { opacity: 1, duration: 0.4 }, tX + 0.3);
  tl.to("#route-main", { opacity: 0.3, duration: 0.6 }, tX + 1.2);
  dash("#route-loop");
  tl.set("#route-loop", { opacity: 1 }, tX + 0.9);
  tl.to("#route-loop", { attr: { "stroke-dashoffset": 0 }, duration: 1.4, ease: "power2.inOut" }, tX + 0.9);
  tl.to("#lab2", { opacity: 1, duration: 0.6, ease: "power2.out" }, tX + 1.0);
  tl.to("#coro", { x: 828, duration: D - tX, ease: "power1.out" }, tX);
  tl.to("#speed", { x: 828, duration: D - tX, ease: "power1.out" }, tX);
  tl.to("#goods rect", { attr: { stroke: "#F87171" }, duration: 0.3, stagger: 0.04 }, tG);
  tl.to("#goods", { opacity: 0.55, duration: 0.45, yoyo: true, repeat: 5, ease: "sine.inOut" }, tG);
  tl.to("#goods-label", { opacity: 1, duration: 0.5 }, tG + 0.2);
  window.__timelines = window.__timelines || {};
  window.__timelines["C1_balasore_layout"] = tl;
</script>
</body>
</html>
