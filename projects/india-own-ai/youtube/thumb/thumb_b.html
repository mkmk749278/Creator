<!doctype html>
<!-- T2 "AI BREAKS THIS": the Telugu letter ఊ (U-long), which the DeepSeek tokenizer stores as two byte pieces
     (research/token_example.txt), cracked into two halves. -->
<html><head><meta charset="utf-8"><style>
@font-face{font-family:Inter;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:Tel;font-weight:800;src:url(noto-sans-telugu-telugu-800-normal.woff2)}
html,body{margin:0;width:1280px;height:720px;overflow:hidden}
body{background:radial-gradient(90% 100% at 64% 50%,#fff4d6 0%,#ffc85a 60%,#e88a1a 100%);position:relative}
.g{position:absolute;left:560px;top:-20px;font:800 520px/1 Tel;color:#13202f;}
.l{clip-path:polygon(0 0,55% 0,47% 30%,58% 48%,44% 70%,53% 100%,0 100%);transform:translate(-26px,10px) rotate(-4deg)}
.r{clip-path:polygon(55% 0,100% 0,100% 100%,53% 100%,44% 70%,58% 48%,47% 30%);transform:translate(30px,-6px) rotate(5deg)}
.crack{position:absolute;left:900px;top:150px;width:30px;height:470px;background:linear-gradient(#ff3b30,#ff7a1a);filter:blur(14px);opacity:.9;transform:rotate(3deg)}
.txt{position:absolute;left:46px;top:70px;font:800 112px/0.92 Inter;color:#13202f;letter-spacing:-3px}
.txt b{color:#e0262b}
.sub{position:absolute;left:52px;top:430px;font:800 40px Inter;color:#13202f;background:#fff;padding:10px 18px;border-radius:12px;box-shadow:0 5px 0 #0003}
</style></head><body>
<div class="crack"></div>
<div class="g l">ఊ</div><div class="g r">ఊ</div>
<div class="txt">A.I.<br>BREAKS<br><b>THIS</b></div>
<div class="sub">1 LETTER → 2 PIECES</div>
</body></html>
