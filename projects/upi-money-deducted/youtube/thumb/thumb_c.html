<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(inter-latin-ext-800-normal.woff2);unicode-range:U+20B9}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;background:#0d1117}
.bg{position:absolute;inset:0;background:url(bg2.jpg) center/cover}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,9,13,.94) 0%,rgba(6,9,13,.75) 50%,rgba(6,9,13,.2) 78%)}
.upi{position:absolute;left:46px;top:36px;font-size:88px;line-height:1;color:#0d1117;background:#ffd166;padding:6px 22px 10px;border-radius:14px}
.t1{position:absolute;left:46px;top:156px;font-size:96px;line-height:1;color:#fff;letter-spacing:-2px}
.t1 b{color:#ff4d4d}
.but{position:absolute;left:50px;top:270px;font-size:60px;color:#fff}
.c1,.c2{position:absolute;left:46px;font-size:64px;padding:10px 26px;border-radius:16px;border:6px solid currentColor;background:rgba(13,17,23,.75)}
.c1{top:356px;color:#f85149}.c2{top:470px;color:#d29922}
.ans{position:absolute;left:46px;top:604px;font-size:42px;padding:10px 22px;border-radius:12px;background:#ffd166;color:#0d1117}
.ph{position:absolute;width:260px;height:500px;border-radius:40px;padding:11px;background:#111;box-shadow:0 30px 70px rgba(0,0,0,.7),inset 0 0 0 3px #3a414c}
.scr{width:100%;height:100%;border-radius:30px;background:#f4f6f9;display:flex;align-items:center;justify-content:center}
.ic{width:160px;height:160px;border-radius:50%;background:#d63a3a;color:#fff;font-size:110px;line-height:160px;text-align:center}
.spin{width:160px;height:160px;border-radius:50%;border:20px solid rgba(210,153,34,.25);border-top-color:#d29922;transform:rotate(30deg)}
.p1{left:760px;top:120px;transform:rotate(-7deg)}.p2{left:1000px;top:100px;transform:rotate(6deg)}
.logo{position:absolute;right:30px;top:24px;width:76px;height:76px;border-radius:12px}
</style></head><body><div class="bg"></div><div class="sh"></div>
<div class="upi">UPI</div><div class="t1"><b>₹840</b> DEBITED</div><div class="but">APP SAYS:</div>
<div class="c1">✕ FAILED</div><div class="c2">⧗ PROCESSING</div>
<div class="ans">WHERE IS IT? + RBI REFUND RULE</div>
<div class="ph p1"><div class="scr"><div class="ic">✕</div></div></div>
<div class="ph p2"><div class="scr"><div class="spin"></div></div></div>
<img class="logo" src="logo.png"></body></html>
