<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(inter-latin-ext-800-normal.woff2);unicode-range:U+20B9}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;background:#0d1117}
.bg{position:absolute;inset:0;background:url(bg2.jpg) center/cover}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,9,13,.92) 0%,rgba(6,9,13,.7) 48%,rgba(6,9,13,.15) 75%)}
.upi{position:absolute;left:48px;top:70px;font-size:120px;line-height:1;color:#0d1117;background:#ffd166;padding:6px 26px 10px;border-radius:16px}
.t1{position:absolute;left:48px;top:236px;font-size:116px;line-height:1;color:#fff;letter-spacing:-2px}
.t1 b{color:#f85149}
.t2{position:absolute;left:52px;top:390px;font-size:70px;color:#d29922}
.phone{position:absolute;left:905px;top:36px;width:330px;height:660px;border-radius:44px;padding:12px;background:#111;box-shadow:0 30px 70px rgba(0,0,0,.7),inset 0 0 0 3px #3a414c;transform:rotate(6deg)}
.scr{width:100%;height:100%;border-radius:34px;background:#f4f6f9;text-align:center;padding-top:150px;color:#12161c}
.amt{font-size:82px}
.spin{width:130px;height:130px;margin:34px auto 22px;border-radius:50%;border:16px solid rgba(210,153,34,.25);border-top-color:#d29922}
.st{font-size:40px;color:#b7791f}
.sms{position:absolute;left:470px;top:510px;width:auto;padding:20px 30px;border-radius:22px;background:#20252e;color:#fff;font-size:50px;line-height:1.25;box-shadow:0 14px 40px rgba(0,0,0,.6);transform:rotate(-3deg)}
.sms small{display:block;font-size:20px;opacity:.7;margin-bottom:6px}
.sms b{color:#ff7b72}
.logo{position:absolute;left:48px;bottom:36px;width:80px;height:80px;border-radius:14px}
</style></head><body><div class="bg"></div><div class="sh"></div>
<div class="upi">UPI</div><div class="t1"><b>₹840</b> GONE?</div><div class="t2">Stuck at Processing</div>
<div class="phone"><div class="scr"><div class="amt">₹840</div><div class="spin"></div><div class="st">Processing…</div></div></div>
<div class="sms"><b>₹840 debited</b></div>
<img class="logo" src="logo.png"></body></html>
