<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:800;src:url(inter-latin-ext-800-normal.woff2);unicode-range:U+20B9}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;background:#0d1117}
.bg{position:absolute;inset:0;background:url(bg.jpg) 62% 60%/135% no-repeat;filter:saturate(1.15) brightness(.95)}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,9,13,.95) 0%,rgba(6,9,13,.75) 42%,rgba(6,9,13,0) 70%)}
.t1{position:absolute;left:52px;top:70px;font-size:96px;line-height:1;color:#fff;letter-spacing:-1px}
.t1 b{color:#f85149}
.t2{position:absolute;left:52px;top:200px;font-size:72px;line-height:1.05;color:#ffd166}
.pill{position:absolute;left:52px;top:430px;display:flex;gap:16px}
.pill span{font-size:34px;padding:12px 20px;border-radius:12px;border:3px solid currentColor;background:rgba(13,17,23,.7)}
.ring{position:absolute;left:770px;top:440px;width:230px;height:230px;border-radius:50%;border:8px solid #d29922;box-shadow:0 0 50px rgba(210,153,34,.8)}
.q{position:absolute;left:980px;top:330px;font-size:150px;color:#d29922;text-shadow:0 6px 30px rgba(0,0,0,.8)}
.logo{position:absolute;right:28px;top:24px;width:86px;height:86px;border-radius:14px}
</style></head><body><div class="bg"></div><div class="sh"></div>
<div class="t1"><b>₹840</b> DEBITED</div><div class="t2">But where<br>did it go?</div>
<div class="pill"><span style="color:#3fb950">✓ SUCCESS</span><span style="color:#f85149">✕ FAILED</span><span style="color:#d29922">⧗ PROCESSING</span></div>
<div class="ring"></div><div class="q">?</div><img class="logo" src="logo.png"></body></html>
