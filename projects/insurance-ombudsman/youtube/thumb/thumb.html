<!doctype html>
<html lang="en">
<!-- YouTube thumbnail, channel theme (assets/brand: navy, gold, gold/blue circuit lines, red pill); series look of Episode 01.
     Variant from the URL hash: #A (the claim comes back cut: ₹3.3 lakh of ₹4.5 lakh, O005; step 4, the Ombudsman, free, file it yourself, O010/O024)
     or #B (the three doors, O006-O009: lawyer, a 20% recovery agent, the Ombudsman; filing costs zero rupees).
     The letter is a SIMULATION, as in the film (no real insurer). Shot by shoot.js at 2x. -->
<head>
<meta charset="UTF-8" />
<style>
  @font-face { font-family: "Inter"; font-weight: 800; src: url("../../../../node_modules/@fontsource/inter/files/inter-latin-800-normal.woff2") format("woff2"); unicode-range: U+0000-00FF, U+2000-206F, U+2190-21FF; }
  @font-face { font-family: "Inter"; font-weight: 800; src: url("../../../../node_modules/@fontsource/inter/files/inter-latin-ext-800-normal.woff2") format("woff2"); unicode-range: U+0100-02FF, U+20A0-20CF; }
  :root { --navy: #0b1530; --gold: #ffd34d; --blue: #4a6fa5; --red: #e5383b; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1280px; height: 720px; overflow: hidden; background: var(--navy); font-family: Inter, Arial, sans-serif; }
  #t { position: relative; width: 1280px; height: 720px; overflow: hidden;
    background: radial-gradient(ellipse at 30% 50%, #18295a 0%, #0b1530 60%, #070d1f 100%); }
  svg.lines { position: absolute; inset: 0; }
  .big { position: absolute; font-weight: 800; line-height: .95; letter-spacing: -.02em; color: #fff; text-shadow: 0 6px 18px rgba(0,0,0,.55); }
  .gold { color: var(--gold); }
  .pill { position: absolute; font-weight: 800; color: #fff; background: var(--red); border-radius: 18px; padding: 14px 26px;
    box-shadow: 0 10px 24px rgba(0,0,0,.45); letter-spacing: -.01em; }
  .logo { position: absolute; right: 26px; bottom: 24px; width: 104px; height: 104px; border-radius: 16px; box-shadow: 0 6px 16px rgba(0,0,0,.5); }
  .tag { position: absolute; font-weight: 800; font-size: 15px; letter-spacing: .12em; color: rgba(255,255,255,.7); }
  .v { display: none; } body.A .vA, body.B .vB { display: block; }

  .paper { position: absolute; width: 430px; height: 520px; background: #f3efe6; border-radius: 10px; padding: 32px 30px;
    box-shadow: 0 30px 60px rgba(0,0,0,.6); color: #0b1530; }
  .ph { font-weight: 800; font-size: 28px; letter-spacing: .04em; border-bottom: 5px solid #0b1530; padding-bottom: 12px; }
  .pl { height: 13px; border-radius: 7px; background: rgba(11,21,48,.18); margin-top: 18px; }
  .row { display: flex; justify-content: space-between; font-weight: 800; font-size: 27px; margin-top: 22px; }
  .row.cut { color: var(--red); font-size: 34px; }
  .stamp { position: absolute; font-weight: 800; font-size: 60px; line-height: 1; color: #e5383b; border: 8px solid #e5383b; border-radius: 14px;
    padding: 12px 20px; transform: rotate(-12deg); letter-spacing: .02em; box-shadow: 0 0 0 4px rgba(229,56,59,.25); }

  .door { position: absolute; width: 190px; height: 330px; border-radius: 10px 10px 0 0; background: #1b2a4f; border: 6px solid #4a6fa5; }
  .door::after { content: ""; position: absolute; right: 18px; top: 160px; width: 16px; height: 16px; border-radius: 50%; background: #8a97ad; }
  .door.shut { opacity: .75; }
  .door.lit { background: linear-gradient(180deg, #fff7d6, #ffd34d); border-color: #ffd34d; box-shadow: 0 0 80px 22px rgba(255,211,77,.5); }
  .door.lit::after { display: none; }
  .dl { position: absolute; width: 190px; text-align: center; font-weight: 800; font-size: 26px; color: #c9d4ea; }
  .unused-x { position: absolute; font-weight: 800; font-size: 120px; color: var(--red); line-height: 1; text-shadow: 0 6px 16px rgba(0,0,0,.6); }
</style>
</head>
<body>
<div id="t">
  <!-- the banner's circuit lines: gold and blue, rounded bends, dot ends -->
  <svg class="lines" viewBox="0 0 1280 720" fill="none" stroke-width="5" stroke-linecap="round">
    <g stroke="#ffd34d"><path d="M0 70 H120" /><path d="M0 640 H70 Q100 640 115 615 L130 590 H170" /></g>
    <g stroke="#4a6fa5"><path d="M0 110 H160" /><path d="M0 680 H120" /></g>
    <g fill="#ffd34d" stroke="none"><circle cx="120" cy="70" r="9" /><circle cx="170" cy="590" r="9" /></g>
    <g fill="#4a6fa5" stroke="none"><circle cx="160" cy="110" r="9" /><circle cx="120" cy="680" r="9" /></g>
  </svg>

  <!-- A: the claim comes back cut, step 4 -->
  <div class="v vA">
    <div class="paper" style="left: 70px; top: 110px; transform: rotate(-5deg);">
      <div class="ph">CLAIM SETTLEMENT</div><div class="pl" style="width:84%"></div><div class="pl" style="width:66%"></div>
      <div class="row" style="margin-top:34px"><span>Claimed</span><span>₹4,50,000</span></div>
      <div class="row"><span>Paid</span><span>₹1,20,000</span></div>
      <div class="row cut"><span>Deducted</span><span>₹3,30,000</span></div>
      <div class="pl" style="width:78%; margin-top:40px"></div><div class="pl" style="width:52%"></div>
      <div class="stamp" style="left: 120px; top: 380px;">CLAIM CUT</div>
    </div>
    <div class="tag" style="left: 100px; top: 660px;">SIMULATION</div>
    <div class="big" style="left: 570px; top: 64px; font-size: 84px;">CLAIM CUT?</div>
    <div class="big gold" style="left: 562px; top: 160px; font-size: 200px;">STEP 4</div>
    <div class="big gold" style="left: 568px; top: 350px; font-size: 92px;">OMBUDSMAN</div>
    <div class="pill" style="left: 574px; top: 480px; font-size: 40px;">FREE · FILE IT YOURSELF</div>
  </div>

  <!-- B: the three doors -->
  <div class="v vB">
    <div class="big" style="left: 64px; top: 70px; font-size: 64px; color: #c9d4ea;">CLAIM REJECTED?</div>
    <div class="big gold" style="left: 58px; top: 150px; font-size: 128px;">THE 3RD</div>
    <div class="big gold" style="left: 58px; top: 280px; font-size: 128px;">DOOR</div>
    <div class="pill" style="left: 66px; top: 470px; font-size: 46px;">₹0 TO FILE</div>
    <div class="door shut" style="left: 680px; top: 220px; width: 160px; height: 290px;"></div>
    <div class="dl" style="left: 665px; top: 524px;">LAWYER</div><div class="dl" style="left: 665px; top: 558px; font-size: 20px; color: #8a97ad;">FEES + WAIT</div>
    <div class="door shut" style="left: 866px; top: 220px; width: 160px; height: 290px;"></div>
    <div class="dl" style="left: 851px; top: 524px;">AGENT</div><div class="dl" style="left: 851px; top: 558px; font-size: 20px; color: #8a97ad;">20% FEE</div>
    <div class="door lit" style="left: 1056px; top: 180px; width: 180px; height: 330px;"></div>
    <div class="dl" style="left: 1026px; top: 524px; width: 240px; color: #ffd34d; font-size: 30px;">OMBUDSMAN</div>
  </div>

  <img class="logo" src="logo.png" alt="Be Practical with Kishore" />
</div>
<script>document.body.className = (location.hash.slice(1) || "A");</script>
</body>
</html>
