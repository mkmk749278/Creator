<!doctype html><html><head><meta charset="utf-8"><style>
/* Owner's concept B (2026-10-22): one shiny magnet over a darkened factory line; CHINA'S CHOKEPOINT. */
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;background:#0d1117;position:relative}
.bg{position:absolute;inset:-20px;background:url(factory.jpg) center/cover;filter:blur(3px) brightness(.38) saturate(.7)}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,9,13,.9) 0%,rgba(6,9,13,.55) 45%,rgba(6,9,13,.1) 75%)}
.glow{position:absolute;left:640px;top:90px;width:640px;height:560px;background:radial-gradient(closest-side,rgba(248,81,73,.5),rgba(248,81,73,.1) 60%,rgba(0,0,0,0))}
.mag{position:absolute;left:760px;top:270px;width:480px;filter:drop-shadow(0 40px 40px rgba(0,0,0,.85))}
.t{position:absolute;left:46px;font-size:104px;line-height:.98;letter-spacing:-3px}
.t1{top:150px;color:#fff}.t2{top:268px;color:#f85149}
.tag{position:absolute;left:50px;top:420px;font-size:44px;color:#0d1117;background:#d29922;padding:8px 22px 12px;border-radius:12px}
.logo{position:absolute;left:50px;bottom:34px;width:70px;height:70px;border-radius:12px}
</style></head><body><div class="bg"></div><div class="sh"></div><div class="glow"></div><img class="mag" src="magnet_crop.png">
<div class="t t1">CHINA'S</div><div class="t t2">CHOKEPOINT</div><div class="tag">94% OF MAGNETS</div>
<img class="logo" src="logo.png"></body></html>
