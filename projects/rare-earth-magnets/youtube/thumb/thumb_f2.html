<!doctype html><html><head><meta charset="utf-8"><style>
/* F2, same picture, a sourced number instead of a claim (2026-10-22): the film's new opening. Your phone, x-rayed: the tiny magnet inside glows. Curiosity: "what is in my phone?" */
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;background:#070a0f;position:relative}
.bg{position:absolute;inset:0;background:url(phone.jpg) 20% 62%/auto 150%;filter:brightness(.7) contrast(1.2) saturate(.95)}
.lens{position:absolute;left:770px;top:228px;width:460px;height:460px;border-radius:50%;overflow:hidden;border:10px solid #58a6ff;
  box-shadow:0 0 60px rgba(88,166,255,.9),inset 0 0 60px rgba(88,166,255,.5);background:#05080c}
.lens img{position:absolute;left:-330px;top:-150px;width:1100px;filter:brightness(1.35) contrast(1.15)}
.beam{position:absolute;left:470px;top:470px;width:310px;height:10px;background:#58a6ff;transform:rotate(-8deg);transform-origin:left center;box-shadow:0 0 20px #58a6ff}
.dot{position:absolute;left:445px;top:452px;width:44px;height:44px;border-radius:50%;background:#58a6ff;box-shadow:0 0 30px #58a6ff}
.t1{position:absolute;left:40px;top:34px;font-size:84px;letter-spacing:-2px;color:#fff;line-height:1;text-shadow:0 8px 30px rgba(0,0,0,.95)}
.t2{position:absolute;left:40px;top:128px;font-size:84px;letter-spacing:-2px;color:#f85149;line-height:1;text-shadow:0 8px 30px rgba(0,0,0,.95)}
.tag{position:absolute;left:44px;bottom:40px;font-size:42px;padding:8px 22px 12px;border-radius:12px;background:#d29922;color:#0d1117}
</style></head><body><div class="bg"></div><div class="dot"></div><div class="beam"></div>
<div class="lens"><img src="buzz_glow.jpg"></div>
<div class="t1">THIS IS IN YOUR PHONE</div><div class="t2">CHINA MAKES 94%</div>
<div class="tag">INDIA HAS THE SAND</div>
</body></html>
