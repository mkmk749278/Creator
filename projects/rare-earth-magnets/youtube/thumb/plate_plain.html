<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
@font-face{font-family:I;font-weight:600;src:url(inter-latin-600-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;background:#0d1117;position:relative}
.bg{position:absolute;inset:0;background:url(sand.jpg) center 60%/cover;filter:brightness(.8) contrast(1.15)}
.sh{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,9,13,.55) 0%,rgba(6,9,13,.25) 40%,rgba(6,9,13,.05) 70%),linear-gradient(0deg,rgba(6,9,13,.55),rgba(6,9,13,0) 40%)}
.glow{position:absolute;left:640px;top:70px;width:640px;height:560px;background:radial-gradient(closest-side,rgba(88,166,255,.55),rgba(88,166,255,.12) 60%,rgba(0,0,0,0));filter:blur(8px)}
.mag{position:absolute;left:705px;top:230px;width:540px;filter:drop-shadow(0 40px 40px rgba(0,0,0,.8))}
.t{position:absolute;left:48px;font-size:108px;line-height:.98;letter-spacing:-3px}
.t1{top:64px;color:#fff}.t2{top:182px;color:#ffb020}
.tag{position:absolute;left:52px;top:322px;font-size:44px;color:#fff;background:#d63a3a;padding:8px 24px 12px;border-radius:12px}
.chip{position:absolute;left:52px;top:446px;font:600 32px/1.25 I;color:#e6edf3;max-width:560px}
.chip b{color:#ffb020;font-weight:800}
.logo{position:absolute;left:52px;bottom:34px;width:70px;height:70px;border-radius:12px}
.fl{position:absolute;inset:0;filter:drop-shadow(0 0 10px rgba(88,166,255,.8))}.cs{position:absolute;left:740px;top:560px;width:500px;height:70px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.85),rgba(0,0,0,0))}
</style></head><body><div class="bg"></div><div class="sh"></div><div class="glow"></div><svg class="fl" width="1280" height="720" viewBox="0 0 1280 720"><g fill="none" stroke="#58a6ff" stroke-linecap="round" opacity=".75">
<path d="M760 420 C 640 260, 700 120, 930 150" stroke-width="5"/><path d="M790 440 C 600 330, 620 60, 980 110" stroke-width="3.5" opacity=".7"/>
<path d="M1200 470 C 1290 320, 1230 170, 1060 170" stroke-width="5"/><path d="M1215 500 C 1320 330, 1250 110, 1020 120" stroke-width="3.5" opacity=".7"/></g></svg>
<div class="cs"></div><img class="mag" src="magnet_crop.png">

</body></html>
