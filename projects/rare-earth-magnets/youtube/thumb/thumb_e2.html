<!doctype html><html><head><meta charset="utf-8"><style>
/* E2 (2026-10-22, independent review's #1 pick, improved): India's dark mineral sand | the finished magnet, stamped MADE IN CHINA.

@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;background:#070a0f;position:relative}
.l{position:absolute;left:0;top:0;width:640px;height:720px;background:url(sand.jpg) 35% 60%/auto 150%;filter:brightness(1.15) contrast(1.35) saturate(1.1)}
.l::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,0) 45%,rgba(0,0,0,.35))}
.tri{position:absolute;left:0;top:0;width:14px;height:720px;background:linear-gradient(180deg,#ff9933 0 33.3%,#ffffff 33.3% 66.6%,#138808 66.6%)}
.r{position:absolute;left:640px;top:0;width:640px;height:720px;background:radial-gradient(circle at 50% 62%,rgba(88,166,255,.45),#070a0f 68%)}
.div{position:absolute;left:636px;top:0;width:8px;height:720px;background:#d29922;box-shadow:0 0 34px rgba(210,153,34,.9)}
.mag{position:absolute;left:700px;top:250px;width:540px;filter:drop-shadow(0 0 46px rgba(88,166,255,.95))}
.stamp{position:absolute;left:820px;top:430px;transform:rotate(-14deg);font-size:44px;letter-spacing:2px;color:#f85149;border:6px solid #f85149;
  border-radius:10px;padding:4px 16px 8px;background:rgba(7,10,15,.55);box-shadow:0 0 24px rgba(248,81,73,.6)}
.t1,.t2{position:absolute;top:34px;width:640px;text-align:center;font-size:96px;line-height:.95;letter-spacing:-3px;text-shadow:0 8px 30px rgba(0,0,0,.95)}
.t1{left:0;color:#fff}.t2{left:640px;color:#fff}.t2 b{color:#f85149}
.tag{position:absolute;left:46px;bottom:44px;font-size:44px;padding:8px 22px 12px;border-radius:12px;background:#d29922;color:#0d1117}
</style></head><body><div class="l"></div><div class="tri"></div><div class="r"></div><div class="div"></div>

<div class="t1">OUR<br>SAND.</div><div class="t2"><b>CHINA'S</b><br>MAGNET.</div>

</body></html>
