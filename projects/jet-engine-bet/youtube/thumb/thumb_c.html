<!doctype html><html><head><meta charset="utf-8"><style>
/* C (main, click panel 2026-10-23: bigger blade crossing into the text side, stamp ties it to India): the hero turbine blade (our render, ILLUSTRATION in the film) glowing hot. "Only 5 nations" adds the stake the title
   doesn't say; the viewer asks what this small part is. Warm and bright on the right, text on a dark left panel. */
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;position:relative;background:#140c08}
.bg{position:absolute;left:-200px;top:-190px;width:1760px;height:990px;background:url(blade.png) center/cover;filter:brightness(1.55) saturate(1.3) contrast(1.08)}
.glow{position:absolute;left:600px;top:20px;width:640px;height:640px;background:radial-gradient(circle,rgba(255,140,40,.45),rgba(255,90,20,0) 65%)}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,8,.95) 0,rgba(10,8,8,.8) 36%,rgba(10,8,8,0) 56%)}
.t1{position:absolute;left:44px;top:110px;font-size:120px;line-height:.95;letter-spacing:-4px;color:#ffd400;text-shadow:0 8px 30px rgba(0,0,0,.9)}
.t2{position:absolute;left:46px;top:370px;font-size:92px;line-height:1;letter-spacing:-3px;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.85)}
.stamp{position:absolute;left:520px;top:560px;font-size:46px;letter-spacing:2px;color:#fff;background:#e5262b;padding:8px 20px 10px;border-radius:8px;transform:rotate(-5deg);box-shadow:0 6px 24px rgba(0,0,0,.6)}
</style></head><body><div class="bg"></div><div class="glow"></div><div class="shade"></div>
 <div class="stamp">INDIA: NOT YET</div><div class="t1">ONLY 5<br>NATIONS</div><div class="t2">CAN MAKE<br>THIS</div>
</body></html>
