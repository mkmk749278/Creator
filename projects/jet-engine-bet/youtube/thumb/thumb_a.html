<!doctype html><html><head><meta charset="utf-8"><style>
/* A: the real Tejas lighting its engine (MoD, GODL-India). The nozzle glow is circled: "India's missing piece" (the series
   name) asks what the circled part is and why it is missing. Bright sky, one accent. */
@font-face{font-family:I;font-weight:800;src:url(inter-latin-800-normal.woff2)}
*{margin:0;padding:0;box-sizing:border-box}body{width:1280px;height:720px;overflow:hidden;font-family:I,sans-serif;font-weight:800;position:relative;background:#2a6fb8}
.bg{position:absolute;left:330px;top:-300px;width:1240px;height:1240px;background:url(afterburner.jpg) center/cover}
.shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(6,14,30,.92) 0,rgba(6,14,30,.75) 34%,rgba(6,14,30,0) 58%)}
.t1{position:absolute;left:44px;top:120px;font-size:96px;line-height:.98;letter-spacing:-3px;color:#fff;text-shadow:0 6px 24px rgba(0,0,0,.8)}
.t2{position:absolute;left:40px;top:330px;font-size:150px;line-height:.95;letter-spacing:-5px;color:#ffd400;text-shadow:0 8px 30px rgba(0,0,0,.9)}
svg{position:absolute;inset:0}
</style></head><body><div class="bg"></div><div class="shade"></div>
<svg width="1280" height="720"><circle cx="1192" cy="336" r="84" fill="none" stroke="#ff3b30" stroke-width="12"/></svg>
<div class="t1">INDIA'S<br>MISSING</div><div class="t2">PIECE</div>
</body></html>
